/* Hauteurs en points, mesurées sur le rendu : elles servent uniquement à
   décider où couper. Le plafond est celui du devis — les lignes s'arrêtent
   avant le pavé de totaux. */
var H_RAPPEL = 16.6, H_ZONE = 17.4, H_LIGNE = 14.4, H_ESPACE = 9,
    H_UTILE = 590 - 317.1;

/* Trois sections, et jamais de mélange entre elles :
     ce qui part aujourd'hui, ce qui était déjà parti, ce qui reste dû.
   Une même référence peut figurer dans plusieurs sections avec des quantités
   différentes — c'est précisément ce qui rend le document lisible.

   Le document se construit AVANT l'écriture en base : à ce moment `liv` est
   encore la livraison d'avant, et `exp - liv` ce qui part maintenant. */
function feuilleBon(d) {
  var toutes = lignesOrdonnees(d);
  var ceJour = [], deja = [], reste = [];
  toutes.forEach(function (l) {
    var n = prepaL(l);                       // part avec cette impression
    if (n > 0) ceJour.push({ l: l, q: n });
    if (l.liv > 0) deja.push({ l: l, q: l.liv });
    var r = Math.max(0, l.du - l.exp);       // ce qui restera dû après
    if (r > 0) reste.push({ l: l, q: r });
  });

  var suite = [], premiere = true;
  function section(titre, lot) {
    if (!lot.length) return;                 // une section vide ne s'imprime pas
    if (!premiere) suite.push({ h: H_ESPACE, html: blEspace(), espace: true });
    premiere = false;
    suite.push({ h: H_ZONE, zone: titre });
    lot.forEach(function (x) {
      suite.push({ h: H_LIGNE, html: blLigne(x.l, x.q) });
    });
  }
  section('R&Eacute;F&Eacute;RENCES LIVR&Eacute;ES PAR CE BON', ceJour);
  section('R&Eacute;F&Eacute;RENCES D&Eacute;J&Agrave; LIVR&Eacute;ES', deja);
  section('R&Eacute;F&Eacute;RENCES RESTANT &Agrave; LIVRER', reste);

  if (!suite.length) {
    suite.push({ h: H_LIGNE,
                 html: '<tr><td></td><td colspan="3">Aucune ligne sur ce bon.</td></tr>' });
  }

  var rappel = '<tr class="ref"><td></td><td colspan="3">V/r&eacute;f&eacute;rence <b>'
      + esc(d.vref) + '</b></td></tr>'
    + '<tr class="ref"><td></td><td colspan="3">N&deg; commande <b>'
      + esc(d.cmde) + '</b></td></tr>';

  var pages = [], cour = [], reste = H_UTILE - 2 * H_RAPPEL, zone = null;
  suite.forEach(function (r) {
    // Une barre de zone seule en bas de page ne sert à rien : on la reporte.
    // Un espaceur, lui, se contente de disparaître s'il tombe sur la coupure :
    // un blanc en haut de page n'aère rien, il décale.
    var besoin = r.zone ? r.h + H_LIGNE : r.h;
    if (besoin > reste && cour.length) {
      pages.push(cour); cour = []; reste = H_UTILE - 2 * H_RAPPEL;
      if (r.espace) return;
      if (!r.zone && zone) { cour.push(blZone(zone, true)); reste -= H_ZONE; }
    }
    if (r.zone) { zone = r.zone; cour.push(blZone(r.zone, false)); }
    else cour.push(r.html);
    reste -= r.h;
  });
  pages.push(cour);

  var h = '', t = instantImpression();
  pages.forEach(function (lignes, i) {
    var dernier = i === pages.length - 1;
    h += '<div class="pf bl">' + blEntete(d, i + 1, pages.length, t)
      + '<table class="ln"><thead><tr>'
      + '<th>R&eacute;f&eacute;rence</th><th>D&eacute;signation</th><th>Qt cmd</th>'
      + '<th>Quantit&eacute;</th>'
      + '</tr></thead><tbody>' + rappel + lignes.join('') + '</tbody></table>';
    if (dernier) {
      h += blTampon()
        + '<div class="edite">&Eacute;tat des livraisons au ' + maintenant() + '.</div>';
    } else {
      h += '<div class="edite">Suite page ' + (i + 2) + '.</div>';
    }
    h += '</div>';
  });
  return h;
}

/* Le récapitulatif : uniquement ce qui reste dû, le plus ancien en tête. */
function feuilleRecap() {
  var ouverts = DATA.filter(function (d) { return ralD(d) > 0; })
                    .sort(function (a, b) { return b.age - a.age; });
  var total = ouverts.reduce(function (s, d) { return s + ralD(d); }, 0);
  var h = '<div class="pf rec">' + pEnTete('Articles en attente de livraison',
      pMeta('Bons concern&eacute;s', String(ouverts.length))
      + pMeta('Pi&egrave;ces en attente', String(total)));
  if (!ouverts.length) {
    h += '<p class="ptot">Aucun article en attente : tous les bons sont livr&eacute;s.</p>';
  } else {
    ouverts.forEach(function (d) {
      h += '<div class="pbloc"><div class="pbt">Bon ' + esc(d.bon)
        + '<span>V/r&eacute;f. ' + esc(d.vref) + ' &middot; du ' + esc(d.date)
        + ' &middot; en attente depuis ' + d.age + ' jour' + (d.age > 1 ? 's' : '')
        + '</span></div>'
        + '<table><thead><tr><th>R&eacute;f&eacute;rence</th><th>D&eacute;signation</th>'
        + '<th class="n">Command&eacute;</th><th class="n">Livr&eacute;</th>'
        + '<th class="n">Reste</th></tr></thead><tbody>';
      lignesOrdonnees(d).forEach(function (l) {
        var rl = ralL(l);
        if (rl <= 0) return;
        h += '<tr class="reste"><td class="mono">' + esc(l.ref) + '</td>'
          + '<td class="d">' + esc(l.des) + '</td>'
          + '<td class="n">' + l.du + '</td><td class="n">' + l.exp + '</td>'
          + '<td class="n">' + rl + '</td></tr>';
      });
      h += '</tbody></table></div>';
    });
    h += '<p class="ptot"><b>' + total + '</b> pi&egrave;ce' + (total > 1 ? 's' : '')
      + ' en attente, r&eacute;parti' + (total > 1 ? 'es' : 'e') + ' sur '
      + ouverts.length + ' bon' + (ouverts.length > 1 ? 's' : '') + '.</p>';
  }
  return h + pPied() + '</div>';
}

/* ---------------------------------------------------------------------------
   Confirmation de livraison

   C'est le pivot du nouveau fonctionnement : tant qu'on n'a pas imprimé, la
   marchandise est préparée, pas livrée. L'impression est donc l'acte qui fait
   basculer les quantités — et un acte qui engage se confirme.

   L'ordre compte : on fabrique la feuille AVANT d'écrire (elle a besoin de
   savoir ce qui était déjà livré), on écrit, et on n'imprime que si l'écriture
   a réussi. Sortir un papier que la base ne confirme pas serait le pire des
   deux mondes.
   --------------------------------------------------------------------------- */
function lancerImpression(d) {
  var aLivrer = d.lignes.filter(function (l) { return prepaL(l) > 0; });
  if (!aLivrer.length) { imprimer(feuilleBon(d)); return; }   // simple réimpression
  confirmerLivraison(d, aLivrer);
}

function confirmerLivraison(d, aLivrer) {
  var total = aLivrer.reduce(function (s, l) { return s + prepaL(l); }, 0);
  var ov = document.createElement('div');
  ov.className = 'ov'; ov.id = 'ov';
  var liste = lignesOrdonnees(d).filter(function (l) { return prepaL(l) > 0; })
    .map(function (l) {
      return '<div class="cl"><span class="clr">' + refHtml(l.ref) + '</span>'
        + '<span class="cld">' + esc(l.des) + '</span>'
        + '<span class="clq">' + prepaL(l) + '</span></div>';
    }).join('');
  ov.innerHTML = '<div class="sheet large" role="dialog" aria-modal="true" '
    + 'aria-labelledby="cfT">'
    + '<h3 id="cfT">Confirmer la livraison&nbsp;?</h3>'
    + '<p>Ces pi&egrave;ces vont &ecirc;tre d&eacute;clar&eacute;es livr&eacute;es au SDIS 33, '
    + 'puis le bon sera imprim&eacute;.</p>'
    + '<div class="clist">' + liste + '</div>'
    + '<p class="cltot"><b>' + total + '</b> pi&egrave;ce' + (total > 1 ? 's' : '')
    + ' sur <b>' + aLivrer.length + '</b> r&eacute;f&eacute;rence'
    + (aLivrer.length > 1 ? 's' : '') + '</p>'
    + '<p class="err" id="cfEr"></p>'
    + '<div class="row"><button class="btn" id="cfNon">Annuler</button>'
    + '<button class="btn pri" id="cfOui">Confirmer et imprimer</button></div></div>';
  document.body.appendChild(ov);
  document.getElementById('cfOui').focus();

  document.getElementById('cfNon').addEventListener('click', fermer);
  ov.addEventListener('click', function (e) { if (e.target === ov) fermer(); });
  document.addEventListener('keydown', echap);

  document.getElementById('cfOui').addEventListener('click', function () {
    var bouton = this;
    bouton.disabled = true; bouton.textContent = 'Enregistrement\u2026';
    var feuille = feuilleBon(d);                 // avant l'écriture, impérativement
    Promise.all(aLivrer.map(function (l) {
      return api('lignes?id=eq.' + encodeURIComponent(l.id), {
        method: 'PATCH', prefer: 'return=representation',
        body: { qte_livree: l.exp, modifie_par: moi }
      }).then(function (r) {
        if (r && r[0]) l.liv = Number(r[0].qte_livree) || 0;
      });
    })).then(function () {
      HISTO[d.id] = null;                        // l'historique vient de changer
      fermer();
      imprimer(feuille);
      rendre();
    }).catch(function (e) {
      bouton.disabled = false; bouton.textContent = 'Confirmer et imprimer';
      document.getElementById('cfEr').innerHTML =
        'Livraison non enregistr&eacute;e, rien n\'a &eacute;t&eacute; imprim&eacute;. '
        + humain(e);
    });
  });
}

function imprimer(html) {
  var z = document.getElementById('print');
  if (!z) return;
  z.innerHTML = html;
  // Laisser au navigateur le temps de poser la mise en page avant d'ouvrir
  // l'aperçu, sinon Chrome imprime parfois une page vide.
  setTimeout(function () { window.print(); }, 60);
}




/* --------------------------------------------------------------------------
   Lignes d'un bon : ordre d'affichage, ajout, suppression, classement manuel
   -------------------------------------------------------------------------- */

/* Les lignes gardent l'ordre du papier, ou celui fixé à la main.

   Elles ne sont PLUS retriées par statut : une ligne qui remonte au moment
   où on la solde déplace toutes les suivantes, et le clic destiné au « + »
   d'une ligne atterrit sur celui d'une autre. Sur une quantité de 5 saisie
   au clic, l'erreur est quasi certaine. */
function lignesOrdonnees(d) {
  return d.lignes.slice().sort(function (a, b) { return a.ordre - b.ordre; });
}

function supprimerLigne(d, lid) {
  var l = d.lignes.filter(function (x) { return x.id === lid; })[0];
  if (!l) return;
  if (!window.confirm('Supprimer la ligne ' + l.ref + ' — ' + l.des + ' ?\n\n'
      + 'Elle disparaîtra définitivement de ce bon.')) return;
  var pos = d.lignes.indexOf(l);
  d.lignes.splice(pos, 1);
  rendrePilules(); rendreListe(); flip(document.getElementById('detail'), rendreDetail);
  api('lignes?id=eq.' + encodeURIComponent(lid), { method: 'DELETE', prefer: 'return=minimal' })
    .catch(function (e) {
      d.lignes.splice(pos, 0, l);
      erreur = 'Suppression non enregistrée. ' + humain(e); rendre();
    });
}

function ajouterLigne(d) {
  var ref = (ajout.ref || '').trim().toUpperCase();
  var q = parseInt(String(ajout.du).replace(/\D/g, ''), 10);
  if (!ref) { ajout.err = 'Indique une référence.'; rendreDetail(); return; }
  if (!q || q <= 0) { ajout.err = 'Indique une quantité supérieure à 0.'; rendreDetail(); return; }
  if (d.lignes.some(function (l) { return l.ref.toUpperCase() === ref; })) {
    ajout.err = 'Cette référence figure déjà sur le bon.'; rendreDetail(); return;
  }
  var des = (ajout.des || '').trim();
  if (!des) {
    var t = CATALOGUE.filter(function (c) { return c[0].toUpperCase() === ref; })[0];
    if (t) des = t[1];
  }
  var maxi = d.lignes.reduce(function (m, l) { return Math.max(m, l.ordre); }, 0);
  api('lignes', { method: 'POST', body: [{
      bon_id: d.id, ordre: maxi + 1, reference: ref, designation: des || null,
      qte_due: q, qte_expediee: 0, a_verifier: false,
      appariement: 'ajout manuel', modifie_par: moi
    }] })
    .then(function (r) {
      ajout = null;
      return charger(true);
    })
    .catch(function (e) {
      ajout.err = /une_reference_par_bon/.test(e.message || '')
        ? 'Cette référence figure déjà sur le bon.' : humain(e);
      rendreDetail();
    });
}

/* Enregistre l'ordre affiché après un glisser-déposer. */
function enregistrerOrdre(d, sequence) {
  sequence.forEach(function (l, i) { l.ordre = i; });
  rendreDetail();
  Promise.all(sequence.map(function (l, i) {
    return api('lignes?id=eq.' + encodeURIComponent(l.id),
               { method: 'PATCH', body: { ordre: i }, prefer: 'return=minimal' });
  })).catch(function (e) {
    erreur = 'Ordre non enregistré. ' + humain(e); rendre();
  });
}


/* --------------------------------------------------------------------------
   Saisie manuelle d'un bon
   Pour les cas que le scan ne couvre pas : une facture, dont la mise en page
   n'a rien à voir avec celle d'un bon de livraison.
   -------------------------------------------------------------------------- */
function aujourdhui() {
  var d = new Date();
  return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2)
       + '/' + d.getFullYear();
}
function nouveauBrouillon() {
  return {
    num: '', vref: '', cmde: '', date: aujourdhui(),
    nature: 'livraison',
    op: moi || '',
    lignes: [{ ref: '', des: '', du: '' }],
    err: ''
  };
}
function frToIso(f) {
  var m = String(f).match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  return m ? m[3] + '-' + m[2] + '-' + m[1] : null;
}

function rendreSaisie() {
  var el = document.getElementById('detail'), b = brouillon;
  var h = '<div class="dh"><div class="meta">'
    + '<div class="kv big"><span>Nouveau bon</span><b>Saisie manuelle</b></div>'
    + '</div><div class="acts">'
    + '<button class="btn" id="annuler">Annuler</button>'
    + '<button class="btn pri" id="enregistrer">Enregistrer le bon</button></div></div>';

  h += '<div class="saisie">'
    + '<div class="sgrid">'
    + '<label class="ch"><span>Nature du document <i>obligatoire</i></span>'
    + '<div class="seg2" id="f-nature">'
    + ['livraison', 'commande'].map(function (n) {
        return '<button type="button" data-nat="' + n + '" aria-pressed="'
             + (b.nature === n ? 'true' : 'false') + '">'
             + (n === 'commande' ? 'CMD' : 'BL') + '</button>'; }).join('')
    + '</div></label>'
    + champ('N&deg; de bon', 'f-num', b.nature === 'commande' ? '' : b.num, 'ex. 0900512',
            b.nature === 'commande' ? '' : 'obligatoire', b.nature === 'commande' ? ' disabled' : '')
    + champ('V/r&eacute;f&eacute;rence SDIS', 'f-vref', b.vref, 'ex. T3263271', '', ' class="maj"')
    + champ('N&deg; commande', 'f-cmde', b.nature === 'commande' ? b.cmde : '', 'ex. 0046259',
            b.nature === 'commande' ? 'obligatoire' : '', b.nature === 'commande' ? '' : ' disabled')
    + champ('Date', 'f-date', b.date, 'JJ/MM/AAAA')
    + '<label class="ch"><span>Op&eacute;rateur</span><select id="f-op">'
    + '<option value="">&mdash;</option>'
    + Object.keys(CODES).map(function (c) { return CODES[c]; }).sort()
        .map(function (n) {
          return '<option value="' + esc(n) + '"' + (n === b.op ? ' selected' : '') + '>'
               + esc(n) + '</option>'; }).join('')
    + '</select></label>'
    + '</div>';

  h += '<div class="slignes"><table><thead><tr>'
    + '<th style="width:34%">R&eacute;f&eacute;rence</th><th>D&eacute;signation</th>'
    + '<th class="n" style="width:90px">Qt&eacute; due</th><th style="width:44px"></th>'
    + '</tr></thead><tbody>';
  b.lignes.forEach(function (l, i) {
    h += '<tr>'
      + '<td><input class="si mono maj" id="l-ref-' + i + '" value="' + esc(l.ref) + '" '
        + 'list="refs" autocomplete="off" placeholder="tape 3 lettres..."></td>'
      + '<td><input class="si" id="l-des-' + i + '" value="' + esc(l.des) + '" '
        + 'placeholder="d&eacute;signation"></td>'
      + '<td><input class="si n" id="l-du-' + i + '" value="' + esc(l.du) + '" '
        + 'inputmode="numeric" placeholder="0"></td>'
      + '<td><button class="sdel" data-del="' + i + '" aria-label="Supprimer la ligne"'
        + (b.lignes.length < 2 ? ' disabled' : '') + '>&times;</button></td>'
      + '</tr>';
  });
  h += '</tbody></table>'
    + '<button class="btn" id="plus" style="margin:12px 0 0">+ Ajouter une ligne</button>'
    + '</div>';
  if (b.err) h += '<p class="serr">' + esc(b.err) + '</p>';
  h += '</div>';
  el.innerHTML = h;

  // autocomplétion : la liste des références réellement vendues à ce client
  if (!document.getElementById('refs')) {
    var dl = document.createElement('datalist'); dl.id = 'refs';
    dl.innerHTML = CATALOGUE.map(function (c) {
      return '<option value="' + esc(c[0]) + '">' + esc(c[1]) + '</option>'; }).join('');
    document.body.appendChild(dl);
  }
}

function champ(lib, id, val, ph, note, attrs) {
  return '<label class="ch"><span>' + lib + ' <i>' + (note || '') + '</i></span>'
    + '<input id="' + id + '" value="' + esc(val) + '" placeholder="' + ph + '" autocomplete="off"'
    + (attrs || '') + '></label>';
}

/* BL : le n° de commande n'existe pas encore, on le verrouille. CMD : c'est
   le n° de commande qui identifie le document, le n° de bon est verrouillé.
   On bascule sur place, sans redessiner : les autres champs restent remplis. */
function verrouNature() {
  var cmd = brouillon.nature === 'commande';
  [['f-num', !cmd], ['f-cmde', cmd]].forEach(function (x) {
    var i = document.getElementById(x[0]); if (!i) return;
    i.disabled = !x[1];
    if (!x[1]) i.value = '';
    var note = i.parentNode.querySelector('i');
    if (note) note.textContent = x[1] ? 'obligatoire' : '';
  });
}

/* Relit les champs du formulaire dans le brouillon (avant tout redessin). */
function lireSaisie() {
  var b = brouillon; if (!b) return;
  function v(id) { var e = document.getElementById(id); return e ? e.value.trim() : ''; }
  b.num = v('f-num'); b.vref = v('f-vref').toUpperCase(); b.cmde = v('f-cmde');
  b.date = v('f-date'); b.op = v('f-op');
  // b.nature n'est pas un champ de saisie : il est posé au clic sur BL / CMD.
  b.lignes.forEach(function (l, i) {
    l.ref = v('l-ref-' + i).toUpperCase(); l.des = v('l-des-' + i); l.du = v('l-du-' + i);
    if (l.ref && !l.des) {                       // désignation reprise du catalogue
      var t = CATALOGUE.filter(function (c) { return c[0].toUpperCase() === l.ref; })[0];
      if (t) l.des = t[1];
    }
  });
}

function enregistrerBrouillon() {
  lireSaisie();
  var b = brouillon;
  // Une commande s'identifie par son n° de commande : il tient lieu de n° de
  // bon en base, comme pour les commandes saisies jusqu'ici.
  var cmd = b.nature === 'commande';
  var num = (cmd ? b.cmde : b.num).replace(/\D/g, '');
  if (!num) { b.err = cmd ? 'Le n° de commande est obligatoire.' : 'Le n° de bon est obligatoire.';
              rendreSaisie(); return; }
  var iso = frToIso(b.date);
  if (!iso) { b.err = 'Date attendue au format JJ/MM/AAAA.'; rendreSaisie(); return; }
  var lignes = b.lignes
    .filter(function (l) { return l.ref && parseFloat(l.du) > 0; })
    .map(function (l, i) {
      return { ordre: i, reference: l.ref, designation: l.des || null,
               qte_due: parseFloat(l.du), a_verifier: false, appariement: 'saisie' };
    });
  if (!lignes.length) { b.err = 'Il faut au moins une ligne avec une référence et une quantité.';
                        rendreSaisie(); return; }
  var vus = {}, doublon = null;
  lignes.forEach(function (l) { if (vus[l.reference]) doublon = l.reference; vus[l.reference] = 1; });
  if (doublon) { b.err = 'La référence ' + doublon + ' apparaît deux fois.'; rendreSaisie(); return; }

  var numBon = num.replace(/^0+(?=\d{7})/, '').padStart(7, '0');
  b.err = ''; rendreSaisie();
  var bouton = document.getElementById('enregistrer');
  if (bouton) { bouton.disabled = true; bouton.textContent = 'Enregistrement\u2026'; }
  var nouvelId = null;
  api('bons', { method: 'POST', body: [{
      num_bon: numBon,
      exercice: String(new Date().getFullYear()),
      client: '30258', depot: '33',
      date_bon: iso,
      vreference: b.vref || null,
      num_commande: cmd ? numBon : null,
      operateur: b.op || null,
      nature: b.nature,
      source: 'saisie manuelle'
    }] })
    .then(function (r) {
      var id = nouvelId = r[0].id;
      lignes.forEach(function (l) { l.bon_id = id; });
      return api('lignes', { method: 'POST', body: lignes, prefer: 'return=minimal' });
    })
    .then(function () {
      // Le bon apparaît tout de suite, ouvert : pas besoin de rafraîchir.
      brouillon = null; vue = 'bons'; sel = nouvelId; vueBon = 'lignes';
      return charger(true);
    })
    .catch(function (e) {
      var m = humain(e);
      if (/bons_num_bon_key|bons_nature_num_idx|duplicate key/i.test(e.message || ''))
        m = 'Ce numéro existe déjà en ' + (b.nature === 'commande' ? 'CMD' : 'BL') + '.';
      // Le bon a pu être créé sans ses lignes : on le retrouve dans la liste.
      if (nouvelId) charger(true);
      brouillon.err = m; rendreSaisie();
    });
}

/* --------------------------------------------------------------------------
   Écran de vérification — la machine propose, l'opérateur tranche
   -------------------------------------------------------------------------- */
function douteSurRef(l) { return /r.f.rence/i.test(l.motif || ''); }
function norefs(x) { return String(x || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }

var PICTOS = {
  ok:   '<path d="M4 12l6 6L20 6"/>',
  brut: '<path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-4"/>',
  ko:   '<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/>'
};
function bouton(cls, id, action, libelle, infobulle) {
  return '<button class="' + cls + '" data-' + action + '="' + id + '" '
    + 'title="' + infobulle + '">'
    + '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" '
    + 'stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">'
    + PICTOS[action] + '</svg>' + libelle + '</button>';
}

function lignesADouter() {
  var out = [];
  DATA.forEach(function (d) {
    d.lignes.forEach(function (l) { if (l.verif) out.push({ d: d, l: l }); });
  });
  return out;
}

function rendreVerif() {
  var el = document.getElementById('detail');
  var liste = lignesADouter();
  var h = '<div class="dh"><div class="meta">'
    + '<div class="kv big"><span>Contr&ocirc;le de lecture</span><b>'
    + liste.length + ' ligne' + (liste.length > 1 ? 's' : '') + '</b></div>'
    + '<div class="kv"><span>Comment faire</span><b style="font-size:13px;font-weight:400">'
    + 'Liasse en main, compare et tranche</b></div>'
    + '</div><div class="acts">'
    + '<button class="btn" id="retour">Retour aux bons</button></div></div>';

  if (!liste.length) {
    h += '<div class="empty">Rien &agrave; v&eacute;rifier.<br>'
       + 'Toutes les lignes ont &eacute;t&eacute; lues avec certitude ou d&eacute;j&agrave; valid&eacute;es.</div>';
    el.innerHTML = h;
    return;
  }

  h += '<div class="revs">';
  liste.forEach(function (p) {
    var d = p.d, l = p.l, ref = douteSurRef(l);
    h += '<div class="rev" data-rev="' + l.id + '">'
      + '<div class="rev-top"><span class="rev-bon">' + esc(d.num) + '</span>'
      + '<span class="rev-vref">' + esc(d.vref) + '</span>'
      + '<span class="rev-des">' + esc(l.des) + '</span></div>'
      + '<div class="rev-mid">';

    // Le lecteur a-t-il proposé autre chose que ce qu'il a lu ?
    var corrigee = l.ocr && norefs(l.ocr) !== norefs(l.ref);

    h += '<span class="rev-lbl">R&eacute;f&eacute;rence</span>';
    if (corrigee) {
      h += '<span class="rev-ocr">' + esc(l.ocr) + '</span>'
        + '<span class="rev-fl">&rarr;</span>'
        + '<span class="rev-prop">' + refHtml(l.ref) + '</span>';
    } else {
      h += '<span class="rev-prop">' + refHtml(l.ref) + '</span>';
    }
    h += '<span class="rev-lbl">Quantit&eacute;</span>'
      + '<span class="rev-ocr">' + l.du + '</span>'
      + (l.motif ? '<span class="rev-motif">' + esc(l.motif.replace(/\s*—\s*lu\s*«.*$/, '')) + '</span>' : '');

    h += '</div><div class="rev-act">';
    if (corrigee) {
      // Trois choix : la proposition, la lecture d'origine, ou autre chose.
      h += bouton('ok', l.id, 'ok', 'Accepter', 'Retenir ' + esc(l.ref))
        + bouton('neutre', l.id, 'brut', 'Garder', 'Retenir la lecture d\'origine : ' + esc(l.ocr))
        + bouton('neutre', l.id, 'ko', 'Modifier', 'Saisir d\'autres valeurs');
    } else {
      h += bouton('ok', l.id, 'ok', 'Valider', 'La lecture est juste')
        + bouton('neutre', l.id, 'ko', 'Modifier', 'Saisir d\'autres valeurs');
    }
    h += '</div></div>';
  });
  h += '</div>';
  el.innerHTML = h;
}

/* Valider : la proposition devient la vérité, la ligne sort de la liste. */
function valider(lid) {
  var p = lignesADouter().filter(function (x) { return x.l.id === lid; })[0];
  if (!p) return;
  p.l.verif = false; p.l.verifiePar = moi;
  rendrePilules(); rendreVerif();
  api('lignes?id=eq.' + encodeURIComponent(lid),
      { method: 'PATCH', body: { verifie_par: moi, modifie_par: moi }, prefer: 'return=minimal' })
    .catch(function (e) {
      p.l.verif = true; erreur = 'Validation non enregistrée. ' + humain(e); rendre();
    });
}

/* Garder : la lecture d'origine devient la vérité, la proposition est écartée. */
function garderLecture(lid) {
  var p = lignesADouter().filter(function (x) { return x.l.id === lid; })[0];
  if (!p) return;
  var l = p.l, avant = l.ref;
  if (!l.ocr) return;
  l.ref = l.ocr.trim().toUpperCase(); l.verif = false; l.verifiePar = moi;
  rendrePilules(); rendreVerif();
  api('lignes?id=eq.' + encodeURIComponent(lid),
      { method: 'PATCH', prefer: 'return=minimal',
        body: { reference: l.ref, verifie_par: moi, modifie_par: moi } })
    .catch(function (e) {
      l.ref = avant; l.verif = true;
      erreur = 'Choix non enregistré. ' + humain(e); rendre();
    });
}

/* Modifier : référence ET quantité en même temps.

   Le programme sait qu'une ligne est douteuse, pas toujours lequel des deux
   champs l'est. Plutôt que de deviner, on ouvre les deux : l'opérateur a la
   liasse sous les yeux, il tranche plus vite que n'importe quelle heuristique. */
function corriger(lid, bouton) {
  var p = lignesADouter().filter(function (x) { return x.l.id === lid; })[0];
  if (!p) return;
  var l = p.l;
  var zone = bouton.closest('.rev').querySelector('.rev-mid');
  // Déjà ouvert : on redonne le focus au lieu de recréer des champs, sinon les
  // anciens restent référencés et l'enregistrement lit des valeurs périmées.
  var deja = zone.querySelector('#cor-ref');
  if (deja) { deja.focus(); deja.select(); return; }
  zone.innerHTML = '<span class="rev-lbl">R&eacute;f&eacute;rence</span>'
    + '<input class="revin" id="cor-ref" list="refs" autocomplete="off" value="' + esc(l.ref) + '">'
    + '<span class="rev-lbl">Quantit&eacute;</span>'
    + '<input class="revin court" id="cor-du" inputmode="numeric" value="' + esc(l.du) + '">'
    + '<span class="rev-lbl">Entr&eacute;e pour enregistrer, &Eacute;chap pour annuler</span>';
  var iref = document.getElementById('cor-ref'), idu = document.getElementById('cor-du');
  iref.focus(); iref.select();
  var fini = false;
  function fin(ok) {
    if (fini) return; fini = true;
    if (!ok) { rendreVerif(); return; }
    var nref = iref.value.trim().toUpperCase();
    var ndu = parseInt(String(idu.value).replace(/\D/g, ''), 10);
    if (!nref || !ndu || ndu <= 0) { rendreVerif(); return; }
    var champs = { verifie_par: moi, modifie_par: moi };
    if (nref !== l.ref.toUpperCase()) champs.reference = nref;
    if (ndu !== l.du) {
      champs.qte_due = ndu;
      // Réduire la quantité due peut rendre la préparation, puis la livraison,
      // supérieures au dû. On les ramène dans les clous d'un coup.
      if (l.exp > ndu) champs.qte_expediee = ndu;
      if (l.liv > ndu) champs.qte_livree = ndu;
    }
    var avant = { ref: l.ref, du: l.du, verif: l.verif };
    if (champs.reference) l.ref = nref;
    if (champs.qte_due) l.du = ndu;
    l.verif = false; l.verifiePar = moi;
    rendrePilules(); rendreVerif();
    api('lignes?id=eq.' + encodeURIComponent(lid),
        { method: 'PATCH', body: champs, prefer: 'return=minimal' })
      .catch(function (e) {
        l.ref = avant.ref; l.du = avant.du; l.verif = avant.verif;
        erreur = 'Correction non enregistrée. ' + humain(e); rendre();
      });
  }
  [iref, idu].forEach(function (i) {
    i.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') fin(true);
      if (ev.key === 'Escape') fin(false);
    });
  });
  zone.addEventListener('focusout', function () {
    setTimeout(function () {
      if (!zone.contains(document.activeElement)) fin(true);
    }, 60);
  });
}

/* --------------------------------------------------------------------------
   Saisie directe de la quantité expédiée
   Cliquer cinquante fois sur « + » pour solder une ligne de 50 pièces n'a
   aucun sens : le compteur s'ouvre en saisie au clic.
   -------------------------------------------------------------------------- */
function editerExp(d, lid, cible) {
  var l = d.lignes.filter(function (x) { return x.id === lid; })[0]; if (!l) return;
  var inp = document.createElement('input');
  inp.type = 'text'; inp.className = 'duin'; inp.value = l.exp;
  inp.setAttribute('inputmode', 'numeric');
  inp.setAttribute('aria-label', 'Quantité expédiée');
  cible.replaceWith(inp); inp.focus(); inp.select();
  var fini = false;
  function fin(ok) {
    if (fini) return; fini = true;
    var v = parseInt(String(inp.value).replace(/\D/g, ''), 10);
    if (ok && !isNaN(v) && v !== l.exp) {
      if (v > l.du) {
        erreur = 'Impossible d\'expédier ' + v + ' : seulement ' + l.du
               + ' d\u00fb sur cette ligne.';
        rendre(); return;
      }
      ecrire(l, { qte_expediee: v });
      rendrePilules(); rendreListe();
    } else { rendreDetail(); }
  }
  inp.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') fin(true);
    if (ev.key === 'Escape') fin(false);
  });
  inp.addEventListener('blur', function () { fin(true); });
}

/* --------------------------------------------------------------------------
   Correction de la quantité due
   -------------------------------------------------------------------------- */
function editerDu(d, lid, cible) {
  var l = d.lignes.filter(function (x) { return x.id === lid; })[0]; if (!l) return;
  var inp = document.createElement('input');
  inp.type = 'text'; inp.className = 'duin'; inp.value = l.du;
  inp.setAttribute('inputmode', 'numeric');
  inp.setAttribute('aria-label', 'Quantité due');
  cible.replaceWith(inp); inp.focus(); inp.select();
  var fini = false;
  function valider(ok) {
    if (fini) return; fini = true;
    var v = parseInt(String(inp.value).replace(/\D/g, ''), 10);
    if (ok && !isNaN(v) && v > 0 && v !== l.du) {
      var champs = { qte_due: v };
      if (l.exp > v) champs.qte_expediee = v;
      ecrire(l, champs);
    } else { rendre(); }
  }
  inp.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') valider(true);
    if (ev.key === 'Escape') valider(false);
  });
  inp.addEventListener('blur', function () { valider(true); });
}

/* Glisser-déposer des lignes. La poignée porte l'attribut draggable pour que
   les boutons +/- de la ligne restent cliquables normalement. */
(function () {
  var det = document.getElementById('detail');

  det.addEventListener('dragstart', function (e) {
    var p = e.target.closest('[data-drag]'); if (!p) return;
    glisse = +p.dataset.drag;
    var tr = p.closest('tr');
    tr.classList.add('drag');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', String(glisse));
    if (e.dataTransfer.setDragImage) e.dataTransfer.setDragImage(tr, 20, 14);
  });

  det.addEventListener('dragover', function (e) {
    if (glisse === null) return;
    var tr = e.target.closest('tr[data-pos]'); if (!tr) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    var r = tr.getBoundingClientRect();
    var apres = (e.clientY - r.top) > r.height / 2;
    [].forEach.call(det.querySelectorAll('tr[data-pos]'), function (x) {
      x.classList.remove('sur-haut', 'sur-bas'); });
    tr.classList.add(apres ? 'sur-bas' : 'sur-haut');
  });

  det.addEventListener('drop', function (e) {
    if (glisse === null) return;
    var tr = e.target.closest('tr[data-pos]'); if (!tr) return;
    e.preventDefault();
    var cible = +tr.dataset.pos;
    var r = tr.getBoundingClientRect();
    if ((e.clientY - r.top) > r.height / 2) cible++;
    var d = DATA.filter(function (x) { return x.id === sel; })[0];
    if (!d) return;
    var seq = lignesOrdonnees(d);
    var depuis = glisse;
    if (cible > depuis) cible--;
    if (cible === depuis) { nettoyerGlisse(); return; }
    var mobile = seq.splice(depuis, 1)[0];
    seq.splice(cible, 0, mobile);
    nettoyerGlisse();
    agir(function () { enregistrerOrdre(d, seq); });
  });

  det.addEventListener('dragend', nettoyerGlisse);

  function nettoyerGlisse() {
    glisse = null;
    [].forEach.call(det.querySelectorAll('tr'), function (x) {
      x.classList.remove('sur-haut', 'sur-bas', 'drag'); });
  }
})();

/* --------------------------------------------------------------------------
   Thème clair / sombre

   Trois états : « clair », « sombre », et rien du tout — ce dernier suit le
   réglage du système, et c'est le défaut. Le choix est mémorisé par poste,
   pas par utilisateur : au comptoir, c'est l'écran et sa lumière qui
   commandent, pas la personne qui passe devant.
   -------------------------------------------------------------------------- */
var SOLEIL = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" '
  + 'stroke="currentColor" stroke-width="2" stroke-linecap="round">'
  + '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4'
  + 'M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>';
var LUNE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" '
  + 'stroke="currentColor" stroke-width="2" stroke-linecap="round" '
  + 'stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 '
  + '10.5 10.5z"/></svg>';

function sombreActuel() {
  var t = document.documentElement.getAttribute('data-theme');
  if (t) return t === 'dark';
  return !window.matchMedia('(prefers-color-scheme: light)').matches;
}
function majTheme() {
  var b = document.getElementById('theme');
  if (!b) return;
  var sombre = sombreActuel();
  b.innerHTML = sombre ? SOLEIL : LUNE;
  b.title = sombre ? 'Passer en th&egrave;me clair' : 'Passer en th&egrave;me sombre';
  b.setAttribute('aria-label', sombre ? 'Passer en thème clair' : 'Passer en thème sombre');
}
document.getElementById('theme').addEventListener('click', function () {
  var neuf = sombreActuel() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', neuf);
  try { localStorage.setItem('sdis-theme', neuf); } catch (e) { /* stockage bloqué */ }
  majTheme();
});
// Si personne n'a choisi, on suit le système jusque dans ses changements.
if (window.matchMedia) {
  var mq = window.matchMedia('(prefers-color-scheme: light)');
  if (mq.addEventListener) mq.addEventListener('change', majTheme);
}
majTheme();

document.getElementById('detail').addEventListener('click', function (e) {
  if (vue === 'saisie') {
    if (e.target.closest('#annuler')) {
      brouillon = null; vue = 'bons'; rendrePilules(); rendreCentre(); return;
    }
    if (e.target.closest('#enregistrer')) { agir(enregistrerBrouillon); return; }
    var nat = e.target.closest('[data-nat]');
    if (nat) {
      // On bascule sur place : redessiner viderait les champs déjà remplis.
      brouillon.nature = nat.dataset.nat;
      [].forEach.call(nat.parentNode.querySelectorAll('button'), function (x) {
        x.setAttribute('aria-pressed', String(x.dataset.nat === brouillon.nature));
      });
      verrouNature();
      return;
    }
    if (e.target.closest('#plus')) {
      lireSaisie(); brouillon.lignes.push({ ref: '', des: '', du: '' }); rendreSaisie();
      var champs = document.querySelectorAll('#detail .slignes input');
      if (champs.length) champs[champs.length - 3].focus();
      return;
    }
    var d = e.target.closest('[data-del]');
    if (d) {
      lireSaisie(); brouillon.lignes.splice(+d.dataset.del, 1); rendreSaisie(); return;
    }
    return;
  }
  if (vue === 'verif') {
    if (e.target.closest('#retour')) { vue = 'bons'; rendrePilules(); rendreCentre(); return; }
    var bo = e.target.closest('[data-ok]');
    if (bo) { agir(function () { valider(bo.dataset.ok); }); return; }
    var bb = e.target.closest('[data-brut]');
    if (bb) { agir(function () { garderLecture(bb.dataset.brut); }); return; }
    var bk = e.target.closest('[data-ko]');
    if (bk) { agir(function () { corriger(bk.dataset.ko, bk); }); return; }
    return;
  }
  var d = DATA.filter(function (x) { return x.id === sel; })[0]; if (!d) return;

  // Bascule Lignes / Historique. Pas de code opérateur : on ne modifie rien.
  if (e.target.closest('#histo')) {
    vueBon = vueBon === 'histo' ? 'lignes' : 'histo';
    rendreDetail();
    return;
  }

  // Le bon remis au client porte le nom de celui qui l'imprime : on demande
  // donc son code, comme pour toute action tracée.
  if (e.target.closest('#imprimer')) {
    agir(function () { lancerImpression(d); });
    return;
  }

  var ent = e.target.closest('[data-ent]');
  if (ent) { agir(function () { editerEntete(d, ent.dataset.ent, ent); }); return; }

  if (e.target.closest('#suppbon')) { agir(function () { supprimerBon(d); }); return; }

  var supp = e.target.closest('[data-supp]');
  if (supp) { agir(function () { supprimerLigne(d, supp.dataset.supp); }); return; }

  if (e.target.closest('#addl')) {
    agir(function () {
      ajout = { ref: '', des: '', du: '', err: '' }; rendreDetail();
      var a = document.getElementById('a-ref'); if (a) a.focus();
    });
    return;
  }
  if (e.target.closest('#a-non')) { ajout = null; rendreDetail(); return; }
  if (e.target.closest('#a-ok')) { agir(function () { lireAjout(); ajouterLigne(d); }); return; }

  var ex = e.target.closest('[data-exp]');
  if (ex) { agir(function () { editerExp(d, ex.dataset.exp, ex); }); return; }

  var du = e.target.closest('[data-du]');
  if (du) { agir(function () { editerDu(d, du.dataset.du, du); }); return; }

  var st = e.target.closest('[data-m]');
  if (st) {
    var lid = st.dataset.l, m = +st.dataset.m;
    agir(function () {
      var l = d.lignes.filter(function (x) { return x.id === lid; })[0]; if (!l) return;
      var v = Math.max(0, Math.min(l.du, l.exp + m));
      if (v === l.exp) return;
      ecrire(l, { qte_expediee: v });
      var tr = document.querySelector('[data-fk="l' + lid + '"]');
      if (tr) { tr.classList.add('flash'); setTimeout(function () { tr.classList.remove('flash'); }, 520); }
    });
    return;
  }
  if (e.target.id === 'tout') {
    agir(function () {
      var aFaire = d.lignes.filter(function (l) { return l.exp < l.du; });
      Promise.all(aFaire.map(function (l) { return ecrire(l, { qte_expediee: l.du }); }))
        .then(function () { flip(document.getElementById('liste'), rendreListe); });
    });
  }
});

/* Rafraîchissement : les 5 postes travaillent sur la même base. */
/* Le rafraîchissement automatique reconstruit le panneau central. Il doit donc
   se taire dès que l'écran contient une saisie en cours, sinon il efface ce que
   l'opérateur est en train de taper — c'était le bug du formulaire de création. */
function saisieEnCours() {
  if (document.getElementById('ov')) return true;        // fenêtre d'identification
  if (vue === 'saisie') return true;                     // création d'un bon
  if (ajout) return true;                                // ajout d'une ligne
  if (document.querySelector('.duin, .revin, .entin')) return true;
  var a = document.activeElement;
  return !!(a && (a.tagName === 'INPUT' || a.tagName === 'SELECT'));
}
// Page cachée ou poste en veille : on ne recharge pas pour rien. Le
// rechargement reprend dès que la page revient au premier plan.
setInterval(function () { if (!document.hidden && !saisieEnCours()) charger(true); },
            CONFIG.rafraichirSecondes * 1000);
window.addEventListener('focus', function () { if (!saisieEnCours()) charger(true); });
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && !saisieEnCours()) charger(true);
});

/* Liste des opérateurs dans le filtre, une fois les données chargées */
function majFiltreOperateurs() {
  var s = document.getElementById('fop'), vus = {}, garde = s.value;
  DATA.forEach(function (d) { if (d.op) vus[d.op] = 1; });
  s.innerHTML = '<option value="">Tous les op&eacute;rateurs</option>';
  Object.keys(vus).sort().forEach(function (o) {
    var opt = document.createElement('option'); opt.value = o; opt.textContent = court(o); s.appendChild(opt);
  });
  s.value = garde;
}
var _rendre = rendre;
rendre = function () { _rendre(); majFiltreOperateurs(); };

(function () {                       // catalogue de références, pour l'autocomplétion
  var dl = document.createElement('datalist'); dl.id = 'refs';
  dl.innerHTML = CATALOGUE.map(function (c) {
    return '<option value="' + esc(c[0]) + '">' + esc(c[1]) + '</option>'; }).join('');
  document.body.appendChild(dl);
})();

majQui();
majPoste();
document.getElementById('poste').addEventListener('click', function () {
  if (session) demanderDeconnexion(); else demanderConnexion();
});
charger(false);
if (!session) demanderConnexion();
})();
