<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>/* avant le premier pixel : sinon l'écran clignote au chargement */
try{var t=localStorage.getItem('sdis-theme');
if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<title>SDIS 33 — Shipping interface</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%9A%92%3C/text%3E%3C/svg%3E">
<style>
/* ===========================================================================
   SDIS 33 — Shipping interface
   Espace client, en lecture seule. Aucune écriture n'est possible depuis
   cette page : elle n'émet que des requêtes de lecture.

   Palette et mouvement identiques à l'outil du comptoir : c'est le même
   système, vu de l'autre côté. Contrastes calculés :
     texte principal / carte 16,6:1 · secondaire 7,7:1 · accent 7,1:1
     blanc sur bleu plein 4,8:1 · sur vert 5,4 · orange 4,7 · rouge 5,6
   =========================================================================== */
:root{
  --bg:#05070F; --card:#0A1024; --card2:#121A33; --fill:#18223F;
  --tx:#EAF0FF; --tx2:#97A6C8; --tx3:#69789A;
  --sep:rgba(150,180,255,.16); --sep2:rgba(150,180,255,.08);
  --acc:#0066FF; --acc-hi:#5AA0FF; --acc-lo:#0A2A63; --acc-halo:rgba(0,102,255,.24);
  --green:#3FD39A; --green-f:#0F7A52;
  --orange:#F0A93B; --orange-f:#A96410;
  --red:#FF7A70; --red-f:#C0342C;
  --sh-s:0 1px 2px rgba(0,0,0,.55);
  --sh-m:0 2px 6px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.45);
  --sh-l:0 24px 64px rgba(0,0,0,.75),0 4px 12px rgba(0,0,0,.6);
  --sh-acc:0 6px 20px rgba(0,102,255,.35);
  --reflet:inset 0 1px 0 rgba(160,195,255,.09);
  --glass:rgba(10,16,36,.62); --glass-bord:rgba(150,180,255,.14);
  --voile:rgba(3,5,12,.55);
  --verre-haut:rgba(24,34,63,.86); --verre-bas:rgba(10,16,36,.94);
  --r-s:9px; --r-m:14px; --r-l:20px;
  --t-clic:140ms; --t-etat:220ms; --t-bloc:340ms;
  --e-sortie:cubic-bezier(.22,1,.36,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{
  margin:0;color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:14px;line-height:1.47;letter-spacing:-.008em;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  background:
    radial-gradient(1200px 680px at 10% -10%, rgba(0,102,255,.18), transparent 62%),
    radial-gradient(900px 520px at 95% 2%, rgba(90,160,255,.11), transparent 58%),
    var(--bg);
  background-attachment:fixed;min-height:100vh;
}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;letter-spacing:inherit}
:focus-visible{outline:3px solid var(--acc-halo);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums;
  font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
*{scrollbar-width:thin;scrollbar-color:transparent transparent}
*:hover{scrollbar-color:var(--sep) transparent}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--sep2);border-radius:9px}
*:hover::-webkit-scrollbar-thumb{background:var(--sep)}

/* ---- hiérarchie : quatre niveaux, portés par la graisse ----------------- */
h1{font-size:26px;font-weight:700;letter-spacing:-.03em;margin:0}
h2{font-size:16px;font-weight:600;letter-spacing:-.015em;margin:0}
h3{font-size:13.5px;font-weight:600;letter-spacing:-.008em;margin:0}
h4{font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;
  color:var(--tx3);margin:0}

/* =========================== connexion =================================== */
.porte{min-height:100vh;display:grid;place-items:center;padding:24px}
.cle{
  width:min(420px,100%);padding:34px 32px 28px;border-radius:26px;text-align:center;
  background:linear-gradient(180deg,var(--verre-haut),var(--verre-bas));
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  backdrop-filter:blur(30px) saturate(180%);
  border:1px solid var(--glass-bord);box-shadow:var(--sh-l),var(--reflet);
  animation:monte 420ms var(--e-sortie) both;
}
/* Le logo est un aplat plein bord à bord : pas de cartouche blanc autour,
   il se pose directement sur le fond sombre. */
.marque{display:inline-block;border-radius:14px;overflow:hidden;
  box-shadow:0 14px 38px rgba(0,0,0,.55);margin-bottom:26px;line-height:0}
.marque img{display:block;width:190px;height:auto}
.cle h1{font-size:30px;letter-spacing:-.035em}
.cle .st{
  font-size:12.5px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;
  color:var(--acc-hi);margin:6px 0 26px;
}
.mdp{
  width:100%;text-align:center;font:inherit;font-size:22px;font-weight:600;
  letter-spacing:.34em;text-indent:.34em;padding:15px 0;border:none;
  border-radius:14px;background:var(--fill);color:var(--tx);
  font-variant-numeric:tabular-nums;transition:box-shadow var(--t-etat) ease;
}
.mdp:focus{outline:none;box-shadow:0 0 0 4px var(--acc-halo)}
.mdp::placeholder{letter-spacing:.04em;font-size:16px;font-weight:500}
.mdp.faux{animation:secousse .4s;box-shadow:0 0 0 4px rgba(255,122,112,.3)}
@keyframes secousse{10%,90%{transform:translateX(-3px)}30%,70%{transform:translateX(5px)}
  50%{transform:translateX(-5px)}}
.cle .err{min-height:20px;font-size:12.5px;color:var(--red);margin:10px 0 0;font-weight:500}
.entrer{
  width:100%;margin-top:14px;padding:14px;border-radius:14px;font-size:15px;font-weight:600;
  background:linear-gradient(180deg,#2E82FF,var(--acc));color:#fff;
  box-shadow:var(--sh-acc),var(--reflet);
  transition:transform var(--t-clic) ease,box-shadow var(--t-clic) ease;
}
.entrer:hover{transform:translateY(-1px);box-shadow:0 12px 32px rgba(0,102,255,.5),var(--reflet)}
.entrer:active{transform:translateY(0) scale(.985)}
.cle .pied{margin:22px 0 0;font-size:11px;color:var(--tx3);line-height:1.6}
@keyframes monte{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* =========================== ossature ==================================== */
.top{
  position:sticky;top:0;z-index:40;
  background:var(--glass);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  backdrop-filter:blur(22px) saturate(180%);
  border-bottom:1px solid var(--glass-bord);box-shadow:0 8px 32px rgba(0,0,0,.45);
}
.topin{max-width:1400px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;
  gap:20px;flex-wrap:wrap}
.ident{display:flex;align-items:center;gap:13px}
.ident .chip{border-radius:8px;overflow:hidden;box-shadow:var(--sh-s);flex:none;line-height:0}
.ident .chip img{display:block;width:92px;height:auto}
.ident b{display:block;font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.ident span{display:block;font-size:9.5px;font-weight:500;letter-spacing:.17em;
  text-transform:uppercase;color:var(--acc-hi)}
.nav{display:flex;gap:4px;background:var(--fill);padding:4px;border-radius:99px}
.nav button{
  padding:8px 18px;border-radius:99px;font-size:13px;font-weight:500;color:var(--tx2);
  transition:background var(--t-clic) ease,color var(--t-clic) ease,box-shadow var(--t-clic) ease;
}
.nav button:hover{color:var(--tx)}
.nav button[aria-current="true"]{
  background:var(--acc);color:#fff;font-weight:600;box-shadow:var(--sh-acc);
}
.sortir{margin-left:auto;padding:8px 15px;border-radius:99px;background:var(--fill);
  font-size:12.5px;font-weight:500;color:var(--tx2);
  transition:color var(--t-clic) ease,background var(--t-clic) ease}
.sortir:hover{color:var(--tx);background:var(--card2)}
.wrap{max-width:1400px;margin:0 auto;padding:22px 24px 60px}
.alerte{max-width:1400px;margin:12px auto 0;padding:11px 16px;border-radius:12px;
  background:var(--red-f);color:#fff;font-size:13px;font-weight:500;
  width:calc(100% - 48px)}

/* ---- barre de filtres : une seule, au-dessus de tout ce qu'elle cadre --- */
.filtres{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.seg{display:flex;gap:3px;background:var(--fill);padding:3px;border-radius:99px}
.seg button{padding:6px 15px;border-radius:99px;font-size:12.5px;font-weight:500;
  color:var(--tx2);transition:background var(--t-clic) ease,color var(--t-clic) ease}
.seg button[aria-pressed="true"]{background:var(--acc);color:#fff;font-weight:600}
.seg button:hover:not([aria-pressed="true"]){color:var(--tx)}
.filtres .maj{margin-left:auto;font-size:11.5px;color:var(--tx3)}

/* ---- cartes ------------------------------------------------------------- */
.carte{
  background:linear-gradient(180deg,var(--card2),transparent 180px),var(--card);
  border:1px solid var(--sep2);border-radius:var(--r-l);
  box-shadow:var(--sh-m),var(--reflet);
  animation:monte var(--t-etat) var(--e-sortie) both;
}
.ct{display:flex;align-items:baseline;gap:12px;padding:18px 20px 0}
.ct h2{flex:1 1 auto;min-width:0}
.ct .sous{font-size:11.5px;color:var(--tx3)}
.grille{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g32{grid-template-columns:2fr 1fr}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}
  .g2,.g32{grid-template-columns:1fr}}
@media(max-width:560px){.g4{grid-template-columns:1fr}}

/* ---- tuiles de chiffres ------------------------------------------------- */
/* La micro-courbe occupe une bande à elle, sous la légende : superposée au
   texte elle le rendrait illisible. */
.tuile{padding:18px 20px 40px;position:relative;overflow:hidden}
.tuile .v{font-size:34px;font-weight:700;letter-spacing:-.035em;line-height:1.05;
  margin:10px 0 3px}
.tuile .u{font-size:14px;font-weight:500;color:var(--tx2);margin-left:3px}
.tuile .c{font-size:11.5px;color:var(--tx3)}
.tuile .c{position:relative;z-index:1}
.tuile .spark{position:absolute;left:0;right:0;bottom:0;width:100%;height:34px;
  opacity:.55;pointer-events:none}
.tuile.acc .v{color:var(--acc-hi)}
.tuile.ok .v{color:var(--green)}
.tuile.att .v{color:var(--orange)}
.tuile.mal .v{color:var(--red)}

/* ---- graphiques --------------------------------------------------------- */
.gr{padding:10px 12px 16px}
.gr svg{display:block;width:100%;height:auto;overflow:visible}
.axe{font-size:10px;fill:var(--tx3);font-variant-numeric:tabular-nums}
.grille-l{stroke:var(--sep2);stroke-width:1}
/* Zones de survol invisibles : larges par construction, pour qu'on n'ait
   pas à viser une colonne de 6 px. */
.zone{cursor:crosshair}
.mark{transition:opacity var(--t-clic) ease}
.gr:hover .mark{opacity:.55}
.gr .mark:hover,.gr .mark.on{opacity:1}
.etiq{font-size:11px;font-weight:600;fill:var(--tx);font-variant-numeric:tabular-nums}
.bulle{
  position:fixed;z-index:60;pointer-events:none;padding:9px 12px;border-radius:10px;
  background:var(--verre-haut);border:1px solid var(--glass-bord);
  color:var(--tx);
  -webkit-backdrop-filter:blur(14px) saturate(180%);
  backdrop-filter:blur(14px) saturate(180%);
  box-shadow:var(--sh-m);font-size:12px;white-space:nowrap;
  opacity:0;transform:translateY(4px);transition:opacity var(--t-clic) ease,
  transform var(--t-clic) ease;
}
.bulle.on{opacity:1;transform:none}
.bulle b{display:block;font-size:13px;font-weight:600;margin-bottom:2px}
.bulle span{color:var(--tx2)}
.vue-tab{
  margin-left:auto;padding:5px 11px;border-radius:99px;background:var(--fill);
  font-size:11px;font-weight:500;color:var(--tx2);
  transition:background var(--t-clic) ease,color var(--t-clic) ease}
.vue-tab:hover{background:var(--card2);color:var(--tx)}
.vue-tab[aria-pressed="true"]{background:var(--acc);color:#fff}

/* ---- tableaux ----------------------------------------------------------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10px;font-weight:500;color:var(--tx3);text-align:left;padding:9px 14px;
  border-bottom:1px solid var(--sep);text-transform:uppercase;letter-spacing:.05em;
  white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--sep2);vertical-align:middle}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr{transition:background var(--t-clic) ease}
tbody tr:hover td{background:rgba(90,160,255,.05)}
.tw{overflow-x:auto}
.ref{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;font-size:12.5px}
.ref em{font-style:normal;color:var(--tx3);font-weight:400;margin:0 1px}
.des{color:var(--tx2);font-size:12.5px}
.bdg{display:inline-block;font-size:11px;font-weight:600;padding:2.5px 9px;border-radius:99px;
  white-space:nowrap;color:#fff}
.b-g{background:var(--green-f)} .b-o{background:var(--orange-f)}
.b-r{background:var(--red-f)}   .b-b{background:var(--acc)}
.b-n{background:var(--tx3)}
.vide{padding:56px 24px;text-align:center;color:var(--tx3);font-size:13.5px;line-height:1.7}

/* ---- liste des bons (onglet Suivi) ------------------------------------- */
/* ---- recherche dans le suivi --------------------------------------------
   Posee en tete de la carte, pleine largeur, separee de la liste par un
   filet : c'est la porte d'entree de l'ecran, pas un filtre accessoire.
   La loupe est dedans et non a cote, pour que le champ reste un seul objet
   qu'on vise au doigt. */
.rech{
  display:flex;align-items:center;gap:10px;
  margin:14px 14px 0;padding:0 14px;
  border-radius:12px;background:var(--fill);
  border:1px solid transparent;
  transition:border-color var(--t-etat) ease,box-shadow var(--t-etat) ease;
}
.rech:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-halo)}
.rech svg{flex:none;color:var(--tx3)}
.rech:focus-within svg{color:var(--acc-hi)}
.rech input{
  flex:1 1 auto;min-width:0;width:100%;
  font:inherit;font-size:13.5px;padding:12px 0;
  border:none;background:none;color:var(--tx);
}
.rech input::placeholder{color:var(--tx3)}
.rech input:focus{outline:none}
.rech button{
  flex:none;display:grid;place-items:center;width:22px;height:22px;
  border-radius:50%;background:var(--card2);color:var(--tx3);
  transition:background var(--t-clic) ease,color var(--t-clic) ease,
             transform var(--t-clic) ease;
}
.rech button:hover{background:var(--card);color:var(--tx)}
.rech button:active{transform:scale(.9)}

/* ---- regroupement des bons dans le suivi --------------------------------
   Les bons encore dus se lisent d'un bloc ; ceux qui sont livres n'ont plus
   rien a dire mais doivent rester consultables. On les plie, comme au
   comptoir, derriere un titre qui annonce leur nombre. */
.grp{
  padding:12px 4px 7px;font-size:11px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--tx3);
}
.disc{
  width:100%;display:flex;align-items:center;gap:8px;margin-top:8px;
  padding:11px 12px;border-radius:12px;background:var(--card2);
  border:1px solid var(--sep);color:var(--tx2);
  font-size:12px;font-weight:600;letter-spacing:.02em;text-align:left;
  transition:background var(--t-clic) ease,color var(--t-clic) ease,
             border-color var(--t-clic) ease;
}
.disc:hover{background:var(--fill);color:var(--tx);border-color:var(--sep2)}
.disc svg{color:var(--tx3);transition:transform var(--t-etat) var(--e-sortie)}
.disc[aria-expanded="true"] svg{transform:rotate(90deg)}
.disc .n{
  margin-left:auto;padding:1px 9px;border-radius:99px;background:var(--fill);
  color:var(--tx2);font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;
}
.disc:hover .n{background:var(--card)}

.bon{border-bottom:1px solid var(--sep2)}
.bon:last-child{border-bottom:none}
/* La jauge dit d'un coup d'œil où en est le bon ; elle n'a pas besoin de
   traverser l'écran pour ça. Le reste de la largeur pousse la date et le
   statut vers la droite, là où l'œil les cherche. */
.bonl{
  display:grid;grid-template-columns:132px 116px 200px 1fr auto auto;gap:16px;
  align-items:center;padding:13px 20px;width:100%;text-align:left;
  transition:background var(--t-clic) ease;
}
.bonl .bdate{text-align:right}
.bonl:hover{background:var(--card2)}
.bonl[aria-expanded="true"]{background:linear-gradient(90deg,var(--acc-lo),transparent)}
.bnum{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
/* BL ou CMD : chez Barrault la commande devient un bon de livraison une fois
   facturee. Pour le SDIS, les deux disent la meme chose — des pieces dues.
   L'etiquette nomme le document sans crier : la couleur reste au statut. */
.nat{
  display:inline-block;margin-right:7px;padding:1.5px 6px;border-radius:5px;
  background:var(--fill);color:var(--tx3);
  font-size:9.5px;font-weight:700;letter-spacing:.06em;vertical-align:1px;
}
.bvr{font-size:12.5px;color:var(--acc-hi);font-variant-numeric:tabular-nums}
.bdate{font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums}
.jauge{height:4px;border-radius:3px;background:var(--fill);overflow:hidden;min-width:60px}
.jauge{position:relative}
/* Le liseré clair montre ce qui est prêt chez Barrault, le trait plein ce qui
   est réellement arrivé. L'écart entre les deux, c'est ce qui va partir. */
.jauge u{position:absolute;inset:0 auto 0 0;display:block;height:100%;border-radius:3px;
  background:var(--acc);opacity:.45;transition:width var(--t-bloc) var(--e-sortie)}
.jauge i{position:relative;z-index:1;display:block;height:100%;border-radius:3px;
  background:var(--green);transition:width var(--t-bloc) var(--e-sortie)}
.chev{color:var(--tx3);transition:transform var(--t-etat) var(--e-sortie)}
.bonl[aria-expanded="true"] .chev{transform:rotate(90deg)}
.detail{padding:2px 20px 18px;animation:monte var(--t-etat) var(--e-sortie) both}

/* ---- bouton d'action principal ----------------------------------------- */
.bouton{
  display:inline-flex;align-items:center;gap:9px;padding:11px 20px;border-radius:99px;
  font-size:13.5px;font-weight:600;background:linear-gradient(180deg,#2E82FF,var(--acc));
  color:#fff;box-shadow:var(--sh-acc),var(--reflet);
  transition:transform var(--t-clic) ease,box-shadow var(--t-clic) ease;
}
.bouton:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(0,102,255,.5),var(--reflet)}
.bouton:active{transform:translateY(0) scale(.98)}
.bouton.calme{background:var(--fill);color:var(--tx2);box-shadow:var(--sh-s)}
.bouton.calme:hover{color:var(--tx);box-shadow:var(--sh-m)}
.demande{
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:20px;
  border-radius:var(--r-m);margin:0 20px 20px;
  background:linear-gradient(120deg,var(--acc-lo),transparent 85%),var(--card2);
  border:1px solid var(--sep2);
}
.demande .t{flex:1 1 260px;min-width:0}
.demande h3{margin-bottom:3px}
.demande p{margin:0;font-size:12.5px;color:var(--tx2)}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}


/* ===========================================================================
   Thème clair

   Seules les variables changent : pas une seule règle de mise en page n'est
   dupliquée. Les quatre aplats (bleu, vert, orange, rouge) sont identiques
   dans les deux thèmes — le blanc dessus passe partout, vérifié au calcul :
     blanc / bleu 4,8:1 · vert 5,4 · orange 4,7 · rouge 5,6
   et en clair : texte principal 18,3:1 · secondaire 7,0 · accent 7,0.

   Trois états possibles : « sombre », « clair », et rien — auquel cas on suit
   le réglage du système. C'est le défaut : un poste réglé en clair ouvre
   l'outil en clair, sans que personne n'ait à toucher au bouton.
   =========================================================================== */
:root[data-theme="light"]{
  --bg:#EEF2FA; --card:#FFFFFF; --card2:#F4F7FD; --fill:#E7EDF9;
  --tx:#0B1526; --tx2:#4A5A76; --tx3:#7A8AA6;
  --sep:rgba(11,40,90,.16); --sep2:rgba(11,40,90,.08);
  --acc:#0066FF; --acc-hi:#0B4FCC; --acc-lo:#DDE8FF; --acc-halo:rgba(0,102,255,.20);
  --green:#0F7A52; --orange:#A96410; --red:#C0342C;
  --sh-s:0 1px 2px rgba(16,40,80,.07);
  --sh-m:0 2px 6px rgba(16,40,80,.07),0 12px 32px rgba(16,40,80,.09);
  --sh-l:0 24px 64px rgba(16,40,80,.22),0 4px 12px rgba(16,40,80,.12);
  --sh-acc:0 6px 20px rgba(0,102,255,.28);
  --reflet:inset 0 1px 0 rgba(255,255,255,.9);
  --glass:rgba(255,255,255,.62);
  --glass-bord:rgba(11,40,90,.10);
  color-scheme:light;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#EEF2FA; --card:#FFFFFF; --card2:#F4F7FD; --fill:#E7EDF9;
    --tx:#0B1526; --tx2:#4A5A76; --tx3:#7A8AA6;
    --sep:rgba(11,40,90,.16); --sep2:rgba(11,40,90,.08);
    --acc:#0066FF; --acc-hi:#0B4FCC; --acc-lo:#DDE8FF; --acc-halo:rgba(0,102,255,.20);
    --green:#0F7A52; --orange:#A96410; --red:#C0342C;
    --sh-s:0 1px 2px rgba(16,40,80,.07);
    --sh-m:0 2px 6px rgba(16,40,80,.07),0 12px 32px rgba(16,40,80,.09);
    --sh-l:0 24px 64px rgba(16,40,80,.22),0 4px 12px rgba(16,40,80,.12);
    --sh-acc:0 6px 20px rgba(0,102,255,.28);
    --reflet:inset 0 1px 0 rgba(255,255,255,.9);
    --glass:rgba(255,255,255,.62);
    --glass-bord:rgba(11,40,90,.10);
    color-scheme:light;
  }
}

/* ---- la nappe de fond, plus franche -------------------------------------
   Trois foyers de couleur au lieu de deux, posés hors cadre pour qu'on ne
   voie que leur diffusion. Fixe : elle ne défile pas avec le contenu. */
body{
  background:
    radial-gradient(1100px 700px at 8% -12%,  rgba(0,102,255,.30),  transparent 60%),
    radial-gradient(900px 620px at 96% -4%,   rgba(90,160,255,.22), transparent 58%),
    radial-gradient(1000px 800px at 50% 112%, rgba(0,72,190,.22),   transparent 62%),
    var(--bg) !important;
  background-attachment:fixed !important;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]) body{
    background:
      radial-gradient(1100px 700px at 8% -12%,  rgba(0,102,255,.16),  transparent 60%),
      radial-gradient(900px 620px at 96% -4%,   rgba(90,160,255,.14), transparent 58%),
      radial-gradient(1000px 800px at 50% 112%, rgba(0,72,190,.10),   transparent 62%),
      var(--bg) !important;
  }
}
:root[data-theme="light"] body{
  background:
    radial-gradient(1100px 700px at 8% -12%,  rgba(0,102,255,.16),  transparent 60%),
    radial-gradient(900px 620px at 96% -4%,   rgba(90,160,255,.14), transparent 58%),
    radial-gradient(1000px 800px at 50% 112%, rgba(0,72,190,.10),   transparent 62%),
    var(--bg) !important;
}

/* ---- verre dépoli, plus lisible -----------------------------------------
   Le flou seul ne se voit pas : ce qui fait le verre, c'est le flou PLUS un
   filet clair en haut de la surface, qui imite l'arête d'une plaque. */
.top,.ov,.sheet,.carte,.card,.cle{
  -webkit-backdrop-filter:blur(26px) saturate(190%);
  backdrop-filter:blur(26px) saturate(190%);
}
.card,.carte{
  position:relative;
  background:
    linear-gradient(150deg,rgba(150,190,255,.14),rgba(150,190,255,.02) 42%,transparent 70%),
    var(--card);
  border:1px solid var(--glass-bord);
  box-shadow:var(--sh-m),var(--reflet);
}
/* le reflet oblique : une bande claire très diffuse en haut à gauche */
.card::before,.carte::before{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.10),transparent 38%);
}
.card>*,.carte>*{position:relative}
.top{border-bottom:1px solid var(--glass-bord)}

/* ---- le bouton de thème -------------------------------------------------- */
.theme{
  display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;
  background:var(--card);box-shadow:var(--sh-s),var(--reflet);color:var(--tx2);
  flex:none;transition:transform var(--t-clic) ease,box-shadow var(--t-clic) ease,
  color var(--t-clic) ease;
}
.theme:hover{color:var(--acc-hi);box-shadow:var(--sh-m),var(--reflet);transform:translateY(-1px)}
.theme:active{transform:translateY(0) scale(.94)}
.theme svg{display:block}

/* ===========================================================================
   Récapitulatif imprimable — mêmes codes que le bon de livraison Barrault
   =========================================================================== */
#print{display:none}
@media print{
  /* La première page porte le bandeau jusqu'au bord ; les suivantes
     reprennent une marge haute, sinon le tableau touche le bord du papier. */
  @page{size:A4 portrait;margin:13mm 0 11mm}
  @page:first{margin:0 0 11mm}
  /* Sans cela le navigateur peint la zone de marge dans le ton sombre
     déclaré par color-scheme : une bande noire en haut de chaque page. */
  :root{color-scheme:light}
  /* Meme piege que sur l'outil du comptoir : la nappe du theme est posee sur
     un selecteur plus specifique avec !important, et le bleu partait a
     l'imprimante. On repete :root pour passer devant. */
  html,body,:root:root:root body{
    background:#fff !important;
    background-image:none !important;
    background-attachment:scroll !important;
  }
  #print,#print .pf{background:#fff !important}
  body>*{display:none !important}
  #print{display:block !important;color:#000}
  #print .pf{position:relative;width:595pt;
    font:8pt/1.2 Arial,Helvetica,"Liberation Sans",sans-serif}
  #print .hz{position:relative;height:302.8pt}
  #print .ban{position:absolute;left:4pt;top:4pt;width:582pt;height:auto}
  #print .t{position:absolute;white-space:nowrap;line-height:1.05}
  #print .ic{position:absolute;top:266.8pt;height:13.4pt;line-height:13.4pt;background:#EBEBEB;
    font-size:8pt;text-align:center;overflow:hidden;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print .iv{position:absolute;top:281pt;text-align:center;line-height:1.15;white-space:nowrap}
  #print table{border-collapse:separate;border-spacing:1.8pt 0;table-layout:fixed;
    width:572.4pt;margin-left:15.2pt}
  #print th{background:#EBEBEB;height:14.3pt;font-size:9pt;font-weight:400;text-align:center;
    padding:0;vertical-align:middle;border:none;color:#000;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print th:nth-child(1){width:90pt} #print th:nth-child(2){width:210.6pt}
  #print th:nth-child(3),#print th:nth-child(4),#print th:nth-child(5){width:87pt}
  #print thead{display:table-header-group}
  #print tr{page-break-inside:avoid}
  #print td{padding:1.4pt 0 1.4pt 11.2pt;vertical-align:top;font-size:8pt;border:none;color:#000}
  #print td.rf{font-weight:bold;white-space:nowrap;padding-left:1pt}
  #print td.q{text-align:right;padding-right:24pt;padding-left:0;white-space:nowrap}
  #print tr.zn td{background:#EBEBEB;font-weight:bold;padding:3pt 0 3pt 4pt;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print .edite{margin:14pt 0 0 17pt;font-size:7pt;color:#444}
}
</style>

/* --------------------------------------------------------------------------

   -------------------------------------------------------------------------- */
function api(chemin, rejoue) {
  return jeton().then(function (j) {
    return fetch(CONFIG.url + '/rest/v1/' + chemin, {
      method: 'GET',
      headers: {
        'apikey': CONFIG.cle,
        'Authorization': 'Bearer ' + j,
        'Content-Type': 'application/json'
      }
    });
  }).then(function (r) {
    // Jeton expiré entre-temps : on le renouvelle et on rejoue une seule fois.
    if (r.status === 401 && session && !rejoue) {
      return renouveler().then(function () { return api(chemin, true); });
    }
    if (!r.ok) return r.text().then(function (t) { throw new Error(t || ('HTTP ' + r.status)); });
    return r.json();
  });
}

/* Session du compte client : gardée dans le navigateur et renouvelée seule,
   pour ne pas redemander le mot de passe à chaque visite. */
var CLE_SESSION = 'sdis-client-session';
var session = lireSession(), renouvellement = null;

function lireSession() {
  try { return JSON.parse(localStorage.getItem(CLE_SESSION)) || null; } catch (e) { return null; }
}
function garderSession(s) {
  session = s ? { access: s.access_token, refresh: s.refresh_token,
                  expire: Date.now() + (s.expires_in || 3600) * 1000 } : null;
  try {
    if (session) localStorage.setItem(CLE_SESSION, JSON.stringify(session));
    else localStorage.removeItem(CLE_SESSION);
  } catch (e) { /* stockage bloqué : la session ne durera que le temps de l'onglet */ }
}
function auth(chemin, corps) {
  return fetch(CONFIG.url + '/auth/v1/' + chemin, {
    method: 'POST',
    headers: { 'apikey': CONFIG.cle, 'Content-Type': 'application/json' },
    body: JSON.stringify(corps)
  }).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) {
      if (r.ok) return j;
      var e = new Error(j.error_description || j.msg || j.message || ('HTTP ' + r.status));
      e.status = r.status; throw e;
    });
  });
}
function renouveler() {
  if (!renouvellement) {
    renouvellement = auth('token?grant_type=refresh_token', { refresh_token: session.refresh })
      .then(garderSession, function (e) {
        // Session refusée (mot de passe changé) : retour à l'écran de connexion.
        // Réseau coupé : on garde la session et on réessaiera.
        if (e.status >= 400 && e.status < 500) { garderSession(null); location.reload(); }
        throw e;
      })
      .then(function () { renouvellement = null; },
            function (e) { renouvellement = null; throw e; });
  }
  return renouvellement;
}
function jeton() {
  if (!session) return Promise.resolve(CONFIG.cle);
  if (Date.now() < session.expire - 60000) return Promise.resolve(session.access);
  var suite = function () { return session ? session.access : CONFIG.cle; };
  return renouveler().then(suite, suite);
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}
/* Les 4 premiers caractères d'une référence sont la marque : on les détache
   visuellement, ça rend une colonne de références beaucoup plus lisible. */
function refHtml(r) {
  r = String(r || '');
  return r.length > 4 ? '<b>' + esc(r.slice(0, 4).trim()) + '</b><em>&middot;</em>'
                      + esc(r.slice(4).trim()) : esc(r);
}
function p2(n) { return ('0' + n).slice(-2); }
function dateFr(t) {
  var d = new Date(t);
  return isNaN(d) ? '' : p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + '/' + d.getFullYear();
}
function heureFr(t) {
  var d = new Date(t);
  return isNaN(d) ? '' : p2(d.getHours()) + ':' + p2(d.getMinutes());
}
function jourCle(t) {
  var d = new Date(t);
  return isNaN(d) ? '' : d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
}
function isoEnFr(s) { return s ? s.split('-').reverse().join('/') : ''; }

function pourcent(a, b) { return b > 0 ? Math.round(a / b * 100) : 0; }

function humain(e) {

function memoire(k, v) {
  try {
    if (v === undefined) return sessionStorage.getItem(k);
    sessionStorage.setItem(k, v);

  return null;
}

  return !window.matchMedia('(prefers-color-scheme: light)').matches;
}
function majTheme() {
  var b = document.getElementById('theme');
  if (!b) return;
  var sombre = sombreActuel();
  b.innerHTML = sombre ? SOLEIL : LUNE;
  b.setAttribute('aria-label', sombre ? 'Passer en thème clair' : 'Passer en thème sombre');
  b.title = b.getAttribute('aria-label');
}
document.getElementById('theme').addEventListener('click', function () {
  var neuf = sombreActuel() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', neuf);
  try { localStorage.setItem('sdis-theme', neuf); } catch (e) { /* stockage bloqué */ }
  majTheme();
});
if (window.matchMedia) {
  var mq = window.matchMedia('(prefers-color-scheme: light)');
  if (mq.addEventListener) mq.addEventListener('change', majTheme);
}
majTheme();

document.getElementById('sortir').addEventListener('click', function () {
  var a = session && session.access;
  garderSession(null);
  if (!a) { location.reload(); return; }
  fetch(CONFIG.url + '/auth/v1/logout', { method: 'POST',
    headers: { 'apikey': CONFIG.cle, 'Authorization': 'Bearer ' + a } })
    .catch(function () {}).then(function () { location.reload(); });
});

/* --------------------------------------------------------------------------
   Chargement
   -------------------------------------------------------------------------- */
/* BL ou CMD — on lit ce que le document a déclaré, jamais une déduction.
   Le code-barres tranche sans erreur possible : 15 chiffres pour un bon de
   livraison, 9 pour une commande. L'import écrit ce verdict dans la colonne
   « nature » ; pour une saisie manuelle, c'est l'opérateur qui l'a choisi au
   comptoir. Ici on se contente de le relire. */
function natureBon(b) {
  return b.nature === 'commande' ? 'CMD' : 'BL';
}

function charger(silencieux) {
  if (!silencieux) { chargement = true; rendre(); }
  return Promise.all([
    api('v_bons?select=*&order=date_bon.desc'),
    api('v_lignes?select=*&order=ordre.asc'),
    api('v_mouvements?select=*&champ=eq.qte_livree&order=au.desc')
  ]).then(function (r) {
    BONS = (r[0] || []).map(function (b) {
      return {
        id: b.id,
        num: b.num_bon,
        bon: (b.exercice ? b.exercice + '/' : '') + b.num_bon,
        nat: natureBon(b),
        vref: b.vreference || '—',
        cmde: b.num_commande || '—',
        date: b.date_bon,
        heure: b.heure_bon || '',
        age: Number(b.anciennete) || 0,
        statut: b.statut,
        nbl: Number(b.nb_lignes) || 0,
        ral: Number(b.ral_pieces) || 0,
        du: Number(b.total_du) || 0,
        exp: Number(b.total_expedie) || 0,
        liv: Number(b.total_livre) || 0,      // parti chez le client
        prepa: Number(b.total_prepa) || 0     // prêt, pas encore parti
      };
    });
    LIGNES = {};
    (r[1] || []).forEach(function (l) {
      (LIGNES[l.bon_id] = LIGNES[l.bon_id] || []).push({
        id: l.id, ordre: Number(l.ordre) || 0,
        ref: l.reference, des: l.designation || '',
        du: Number(l.qte_due) || 0,
        exp: Number(l.qte_expediee) || 0,
        liv: Number(l.qte_livree) || 0,
        prepa: Math.max(0, (Number(l.qte_expediee) || 0) - (Number(l.qte_livree) || 0)),
        ral: Math.max(0, (Number(l.qte_due) || 0) - (Number(l.qte_livree) || 0))
      });
    });
    MVT = (r[2] || []).map(function (m) {
      return {
        au: m.au, bon: m.bon_id, ref: m.reference, des: m.designation || '',
        num: (m.exercice ? m.exercice + '/' : '') + m.num_bon,
        vref: m.vreference || '—',
        avant: Number(m.avant) || 0, apres: Number(m.apres) || 0,
        delta: (Number(m.apres) || 0) - (Number(m.avant) || 0)
      };
    });
    chargement = false; erreur = null; majLe = new Date();
    rendre();
  }).catch(function (e) {
    chargement = false; erreur = humain(e); rendre();
  });
}

/* --------------------------------------------------------------------------
   Calculs

   Tous les indicateurs sortent des mêmes trois jeux de données. Rien n'est
   stocké côté client : si la base change, le tableau de bord change avec.
   -------------------------------------------------------------------------- */
function depuis(jours) {
  if (!jours) return new Date(0);
  var d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - jours + 1);
  return d;
}
function bonsPeriode() {
  var t0 = depuis(periode);
  return BONS.filter(function (b) { return new Date(b.date) >= t0; });
}
function mvtPeriode() {
  var t0 = depuis(periode);
  return MVT.filter(function (m) { return new Date(m.au) >= t0; });
}
function enCours() { return BONS.filter(function (b) { return b.statut !== 'livre'; }); }

/* Dernier mouvement de chaque bon : sert à dater le solde. */
function dernierMvt() {
  var m = {};
  MVT.forEach(function (x) { if (!m[x.bon] || x.au > m[x.bon]) m[x.bon] = x.au; });
  return m;
}

function delaiMoyenSolde() {
  var fin = dernierMvt(), total = 0, n = 0;
  bonsPeriode().forEach(function (b) {
    if (b.statut !== 'livre' || !fin[b.id]) return;
    var j = (new Date(fin[b.id]) - new Date(b.date)) / 86400000;
    if (j >= 0 && j < 400) { total += j; n++; }
  });
  return n ? { j: total / n, n: n } : null;
}

/* Pièces livrées par jour : on ne compte que les mouvements positifs. Un
   retour en arrière corrige une erreur de pointage, il ne « dé-livre » rien. */
function parJour() {
  var t0 = depuis(periode === 0 ? 90 : periode), out = [], idx = {};
  var d = new Date(t0), fin = new Date(); fin.setHours(0, 0, 0, 0);
  while (d <= fin) {
    var k = jourCle(d);
    idx[k] = out.length;
    out.push({ k: k, jour: new Date(d), v: 0 });
    d.setDate(d.getDate() + 1);
  }
  MVT.forEach(function (m) {
    var i = idx[jourCle(m.au)];
    if (i !== undefined && m.delta > 0) out[i].v += m.delta;
  });
  return out;
}

function tranchesAge() {
  var t = [{ lib: 'moins de 7 j', c: 'g', n: 0, p: 0 },
           { lib: '7 &agrave; 14 j', c: 'o', n: 0, p: 0 },
           { lib: 'plus de 14 j', c: 'r', n: 0, p: 0 }];
  enCours().forEach(function (b) {
    var i = b.age < 7 ? 0 : (b.age <= 14 ? 1 : 2);
    t[i].n++; t[i].p += b.ral;
  });
  return t;
}

/* Taux de service par semaine, sur les bons émis cette semaine-là. */
function parSemaine(n) {
  var out = [], base = new Date(); base.setHours(0, 0, 0, 0);
  base.setDate(base.getDate() - ((base.getDay() + 6) % 7));      // lundi courant
  for (var i = n - 1; i >= 0; i--) {
    var deb = new Date(base); deb.setDate(deb.getDate() - i * 7);
    var f = new Date(deb); f.setDate(f.getDate() + 7);
    var du = 0, ex = 0;
    BONS.forEach(function (b) {
      var d = new Date(b.date);
      if (d >= deb && d < f) { du += b.du; ex += b.liv; }
    });
    out.push({ deb: deb, du: du, ex: ex, taux: du ? ex / du * 100 : null });
  }
  return out;
}

function topAttente(n) {
  var m = {};
  BONS.forEach(function (b) {
    (LIGNES[b.id] || []).forEach(function (l) {
      if (l.ral <= 0) return;
      if (!m[l.ref]) m[l.ref] = { ref: l.ref, des: l.des, v: 0, bons: 0 };
      m[l.ref].v += l.ral; m[l.ref].bons++;
    });
  });
  return Object.keys(m).map(function (k) { return m[k]; })
    .sort(function (a, b) { return b.v - a.v; }).slice(0, n);
}

/* ===========================================================================
   Graphiques

   SVG écrit à la main, sans bibliothèque : la page reste un fichier unique,
   qui s'ouvre même sans réseau extérieur.

   Specs tenues partout : barres de 24 px au plus, extrémité arrondie de 4 px
   côté donnée et carrée sur la ligne de base, 2 px de fond entre deux barres
   voisines, courbes de 2 px, grille en trait plein d'un cran au-dessus du
   fond, étiquettes en couleur de texte — jamais en couleur de série.
   =========================================================================== */
var W = 800;

function echelle(max) {
  if (max <= 0) return { max: 1, pas: [0, 1] };
  var brut = max / 4, e = Math.pow(10, Math.floor(Math.log(brut) / Math.LN10));
  var pas = [1, 2, 2.5, 5, 10].map(function (m) { return m * e; })
              .filter(function (v) { return v >= brut })[0] || e * 10;
  var haut = Math.ceil(max / pas) * pas, t = [];
  for (var v = 0; v <= haut + 1e-9; v += pas) t.push(v);
  return { max: haut, pas: t };
}

function grille(ech, hb, larg) {
  var g = '', L = larg || W;
  ech.pas.forEach(function (v) {
    var y = hb - (v / ech.max) * hb;
    g += '<line class="grille-l" x1="42" y1="' + y.toFixed(1) + '" x2="' + L
       + '" y2="' + y.toFixed(1) + '"/>'
       + '<text class="axe" x="34" y="' + (y + 3.5).toFixed(1)
       + '" text-anchor="end">' + nb(v) + '</text>';
  });
  return g;
}

/* Extrémité arrondie côté donnée, base carrée. */
function pilier(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h));
  return 'M' + x + ',' + (y + h) + 'V' + (y + r)
       + 'a' + r + ',' + r + ' 0 0 1 ' + r + ',-' + r
       + 'h' + (w - 2 * r)
       + 'a' + r + ',' + r + ' 0 0 1 ' + r + ',' + r
       + 'V' + (y + h) + 'Z';
}
function barreH(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, h / 2, w));
  return 'M' + x + ',' + y + 'H' + (x + w - r)
       + 'a' + r + ',' + r + ' 0 0 1 ' + r + ',' + r
       + 'v' + (h - 2 * r)
       + 'a' + r + ',' + r + ' 0 0 1 ' + (-r) + ',' + r
       + 'H' + x + 'Z';
}

/* --- colonnes : pièces livrées par jour ---------------------------------- */
function grColonnes(pts) {
  var H = 210, hb = 168;
  var max = pts.reduce(function (m, p) { return Math.max(m, p.v); }, 0);
  var ech = echelle(max);
  var band = (W - 46) / pts.length;
  var larg = Math.min(24, Math.max(2, band - 2));        // 2 px de fond entre voisines
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" '
        + 'aria-label="Pi&egrave;ces livr&eacute;es par jour">' + grille(ech, hb);
  var moisVu = '';
  pts.forEach(function (p, i) {
    var x = 46 + i * band + (band - larg) / 2;
    var h = ech.max ? (p.v / ech.max) * hb : 0;
    if (p.v > 0) {
      s += '<path class="mark" d="' + pilier(x, hb - h, larg, h, 4) + '" fill="var(--acc-hi)"'
        + ' data-tip="' + esc(dateFr(p.jour)) + '|' + p.v + ' pi&egrave;ce'
        + (p.v > 1 ? 's' : '') + ' livr&eacute;e' + (p.v > 1 ? 's' : '') + '"/>';
    }
    // cible de survol généreuse, même les jours sans livraison
    s += '<rect class="zone" x="' + (46 + i * band) + '" y="0" width="' + band
       + '" height="' + hb + '" fill="transparent" data-tip="' + esc(dateFr(p.jour))
       + '|' + (p.v ? p.v + ' pi&egrave;ce' + (p.v > 1 ? 's' : '') : 'aucune livraison') + '"/>';
    var mois = p.jour.toLocaleDateString('fr-FR', { month: 'short' });
    if (mois !== moisVu && (i === 0 || p.jour.getDate() <= 7)) {
      moisVu = mois;
      s += '<text class="axe" x="' + (46 + i * band) + '" y="' + (hb + 16) + '">'
         + esc(mois) + '</text>';
    }
  });
  return s + '</svg>';
}

/* --- tranches d'ancienneté ------------------------------------------------
   Couleurs d'état, et jamais seules : chaque colonne porte son libellé sous
   l'axe et sa valeur au sommet. Le vert, l'orange et le rouge confirment,
   ils n'informent pas tout seuls. */
function grTranches(t) {
  /* Cette carte est deux fois plus étroite que les autres : avec le gabarit
     commun, les libellés seraient réduits de moitié et deviendraient
     illisibles. On lui donne donc le sien. */
  var L = 400, H = 250, hb = 176;
  var max = t.reduce(function (m, x) { return Math.max(m, x.p); }, 0);
  var ech = echelle(max);
  var band = (L - 46) / t.length, larg = Math.min(64, band - 22);
  var teintes = { g: 'var(--green)', o: 'var(--orange)', r: 'var(--red)' };
  var s = '<svg viewBox="0 0 ' + L + ' ' + H + '" role="img" '
        + 'aria-label="Pi&egrave;ces en attente par anciennet&eacute;">'
        + grille(ech, hb, L);
  t.forEach(function (x, i) {
    var cx = 46 + i * band + band / 2, h = ech.max ? (x.p / ech.max) * hb : 0;
    if (x.p > 0) {
      s += '<path class="mark" d="' + pilier(cx - larg / 2, hb - h, larg, h, 4)
        + '" fill="' + teintes[x.c] + '" data-tip="' + x.lib + '|' + x.n + ' bon'
        + (x.n > 1 ? 's' : '') + ' &middot; ' + x.p + ' pi&egrave;ce'
        + (x.p > 1 ? 's' : '') + '"/>';
    }
    s += '<text class="etiq" x="' + cx + '" y="' + (hb - h - 10)
       + '" text-anchor="middle" style="font-size:15px">' + nb(x.p) + '</text>'
       + '<text class="axe" x="' + cx + '" y="' + (hb + 22)
       + '" text-anchor="middle" style="font-size:13px;fill:var(--tx2)">'
       + x.lib + '</text>'
       + '<text class="axe" x="' + cx + '" y="' + (hb + 42)
       + '" text-anchor="middle" style="font-size:12px">' + x.n + ' bon'
       + (x.n > 1 ? 's' : '') + '</text>';
  });
  return s + '</svg>';
}

/* --- courbe : taux de service hebdomadaire ------------------------------- */
function grCourbe(sem) {
  var H = 210, hb = 160, x0 = 46;
  var pts = sem.filter(function (s) { return s.taux !== null; });
  if (pts.length < 2) {
    return '<svg viewBox="0 0 ' + W + ' ' + H + '"><text class="axe" x="' + (W / 2)
      + '" y="' + (H / 2) + '" text-anchor="middle">Pas encore assez de semaines '
      + 'pour tracer une tendance.</text></svg>';
  }
  var ech = { max: 100, pas: [0, 25, 50, 75, 100] };
  var pas = (W - x0 - 12) / (sem.length - 1);
  var xy = sem.map(function (s, i) {
    return { x: x0 + i * pas, y: s.taux === null ? null : hb - (s.taux / 100) * hb, s: s };
  }).filter(function (p) { return p.y !== null; });

  var d = xy.map(function (p, i) {
    return (i ? 'L' : 'M') + p.x.toFixed(1) + ',' + p.y.toFixed(1);
  }).join(' ');
  var aire = d + ' L' + xy[xy.length - 1].x.toFixed(1) + ',' + hb + ' L'
           + xy[0].x.toFixed(1) + ',' + hb + ' Z';

  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" '
        + 'aria-label="Taux de service par semaine">' + grille(ech, hb);
  s += '<path d="' + aire + '" fill="var(--acc-hi)" opacity=".10"/>'
     + '<path d="' + d + '" fill="none" stroke="var(--acc-hi)" stroke-width="2" '
     + 'stroke-linejoin="round" stroke-linecap="round"/>';
  xy.forEach(function (p, i) {
    var dernier = i === xy.length - 1;
    if (dernier) {
      // L'étiquette se place au-dessus du point, sauf s'il est trop haut :
      // elle sortirait du cadre et croiserait la courbe.
      var haut = p.y < 40;
      s += '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="5" '
         + 'fill="var(--acc-hi)" stroke="var(--card)" stroke-width="2"/>'
         + '<text class="etiq" x="' + (p.x - 12).toFixed(1) + '" y="'
         + (haut ? p.y + 20 : p.y - 16).toFixed(1) + '" text-anchor="end">'
         + Math.round(p.s.taux) + ' %</text>';
    }
    s += '<rect class="zone" x="' + (p.x - pas / 2).toFixed(1) + '" y="0" width="'
       + pas.toFixed(1) + '" height="' + hb + '" fill="transparent" data-tip="Semaine du '
       + esc(dateFr(p.s.deb)) + '|' + Math.round(p.s.taux) + ' % servi &middot; '
       + nb(p.s.ex) + ' sur ' + nb(p.s.du) + ' pi&egrave;ces"/>';
  });
  sem.forEach(function (x, i) {
    if (i % 2) return;
    s += '<text class="axe" x="' + (x0 + i * pas).toFixed(1) + '" y="' + (hb + 17)
       + '" text-anchor="middle">' + p2(x.deb.getDate()) + '/'
       + p2(x.deb.getMonth() + 1) + '</text>';
  });
  return s + '</svg>';
}

/* --- barres horizontales : références les plus attendues ----------------- */
function grBarres(t) {
  if (!t.length) return '';
  var lh = 30, H = t.length * lh + 14, x0 = 190;
  var max = t[0].v;
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" '
        + 'aria-label="R&eacute;f&eacute;rences les plus attendues">';
  t.forEach(function (x, i) {
    var y = i * lh + 6, h = Math.min(24, lh - 6);
    var w = Math.max(3, (x.v / max) * (W - x0 - 60));
    s += '<text class="axe" x="' + (x0 - 12) + '" y="' + (y + h / 2 + 3.5)
       + '" text-anchor="end" style="font-size:11px;fill:var(--tx2)">' + esc(x.ref) + '</text>'
       + '<path class="mark" d="' + barreH(x0, y, w, h, 4) + '" fill="var(--acc-hi)" '
       + 'data-tip="' + esc(x.ref) + '|' + x.v + ' pi&egrave;ce' + (x.v > 1 ? 's' : '')
       + ' sur ' + x.bons + ' bon' + (x.bons > 1 ? 's' : '') + '"/>'
       + '<text class="etiq" x="' + (x0 + w + 9) + '" y="' + (y + h / 2 + 4) + '">'
       + nb(x.v) + '</text>';
  });
  return s + '</svg>';
}

/* --- micro-courbe des tuiles --------------------------------------------- */
function etincelle(vals, teinte) {
  if (vals.length < 2) return '';
  var w = 150, h = 46, max = Math.max.apply(null, vals) || 1;
  var d = vals.map(function (v, i) {
    return (i ? 'L' : 'M') + (i / (vals.length - 1) * w).toFixed(1) + ','
         + (h - (v / max) * (h - 6)).toFixed(1);
  }).join(' ');
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" '
    + 'aria-hidden="true">'
    + '<path d="' + d + ' L' + w + ',' + h + ' L0,' + h + ' Z" fill="' + teinte
    + '" opacity=".13"/><path d="' + d + '" fill="none" stroke="' + teinte
    + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity=".7"/></svg>';
}

/* --- carte contenant un graphique, avec sa vue tableau -------------------
   Aucune valeur n'est enfermée dans une infobulle : chaque graphique a son
   tableau jumeau, atteignable d'un clic. */
function carteGraphique(id, titre, sous, svg, entetes, lignes) {
  var tab = tableaux[id];
  var h = '<section class="carte"><div class="ct"><div style="flex:1 1 auto;min-width:0">'
    + '<h2>' + titre + '</h2>'
    + (sous ? '<div class="sous">' + sous + '</div>' : '') + '</div>'
    + '<button class="vue-tab" data-tab="' + id + '" aria-pressed="' + !!tab + '">'
    + (tab ? 'Graphique' : 'Tableau') + '</button></div>';
  if (tab) {
    h += '<div class="tw" style="padding:12px 8px 4px"><table><thead><tr>'
      + entetes.map(function (e, i) {
          return '<th' + (i ? ' class="n"' : '') + '>' + e + '</th>'; }).join('')
      + '</tr></thead><tbody>'
      + (lignes.length ? lignes.map(function (l) {
          return '<tr>' + l.map(function (c, i) {
            return '<td' + (i ? ' class="n"' : '') + '>' + c + '</td>'; }).join('') + '</tr>';
        }).join('') : '<tr><td colspan="' + entetes.length
          + '" style="color:var(--tx3)">Aucune donn&eacute;e sur la p&eacute;riode.</td></tr>')
      + '</tbody></table></div>';
  } else {
    h += '<div class="gr">' + svg + '</div>';
  }
  return h + '</section>';
}

/* ===========================================================================
   Écran 1 — tableau de bord
   =========================================================================== */
function vueBord() {
  var ec = enCours();
  var piecesAtt = ec.reduce(function (s, b) { return s + b.ral; }, 0);
  var bp = bonsPeriode();
  var du = bp.reduce(function (s, b) { return s + b.du; }, 0);
  var ex = bp.reduce(function (s, b) { return s + b.liv; }, 0);
  var taux = pourcent(ex, du);
  var delai = delaiMoyenSolde();
  var jours = parJour(), tr = tranchesAge(), sem = parSemaine(12), top = topAttente(8);
  var derniers = BONS.filter(function (b) { return b.statut === 'livre'; }).slice(0, 6);
  var fin = dernierMvt();

  var h = '<div class="grille g4" style="margin-bottom:16px">';
  h += '<section class="carte tuile acc"><h4>Bons en cours</h4>'
    + '<div class="v">' + ec.length + '</div>'
    + '<div class="c">sur ' + BONS.length + ' bons suivis &middot; &agrave; l\'instant</div>'
    + etincelle(jours.slice(-24).map(function (j) { return j.v; }), 'var(--acc-hi)') + '</section>';
  h += '<section class="carte tuile att"><h4>Pi&egrave;ces en attente</h4>'
    + '<div class="v">' + nb(piecesAtt) + '</div>'
    + '<div class="c">reste &agrave; livrer, tous bons confondus</div></section>';
  h += '<section class="carte tuile ' + (taux >= 90 ? 'ok' : taux >= 70 ? 'att' : 'mal')
    + '"><h4>Taux de service</h4>'
    + '<div class="v">' + taux + '<span class="u">%</span></div>'

        + '<td class="n">' + (j === null ? '—' : j + ' j') + '</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  return h + '</section>';
}

   Écran 3 — suivi des bons
   =========================================================================== */
/* Quatre états, et le mot dit exactement ce qui se passe côté Barrault :
   « en préparation » veut dire que la pièce est là et attend de partir. */
var LIB = { livre: 'Livr&eacute;', partiel: 'Livr&eacute; partiellement',
            prepa: 'En pr&eacute;paration', attente: 'En attente',
            retard: 'En retard', surveiller: '&Agrave; surveiller' };
var CLS = { livre: 'b-g', partiel: 'b-o', prepa: 'b-b', attente: 'b-n',
            retard: 'b-r', surveiller: 'b-o' };

/* ===========================================================================
   Recherche dans le suivi

   Quatre façons de nommer le même bon, et le client en utilise une seule :
   le SDIS relance sur SA référence (T32634...), le comptoir répond avec le
   numéro de bon, la commande porte un troisième numéro, et au téléphone on
   cite souvent la pièce. Un champ unique les accepte tous plutôt que de
   demander à l'utilisateur de savoir dans quelle case il doit taper.

   La comparaison ignore espaces, tirets et accents : « FEBI 193547 »,
   « febi193547 » et « 193547 » trouvent la même ligne, et « T3263405 » comme
   « 3263405 » trouvent le même bon.
   =========================================================================== */
function aplat(x) {
  return String(x == null ? '' : x)
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toUpperCase().replace(/[^A-Z0-9]/g, '');
}

function correspond(b, c) {
  if (!c) return true;
  if (aplat(b.bon).indexOf(c) >= 0) return true;      // 2026/0901049
  if (aplat(b.num).indexOf(c) >= 0) return true;      // 0901049
  if (aplat(b.vref).indexOf(c) >= 0) return true;     // T3263405
  if (aplat(b.cmde).indexOf(c) >= 0) return true;     // 0046259
  // les références pièces : un bon correspond s'il en contient une
  var lg = LIGNES[b.id] || [];
  for (var i = 0; i < lg.length; i++) {
    if (aplat(lg[i].ref).indexOf(c) >= 0) return true;
    if (aplat(lg[i].des).indexOf(c) >= 0) return true;
  }
  return false;
}

function barreRecherche() {
  return '<div class="rech">'
    + '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" '
      + 'stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">'
      + '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>'
    + '<input id="q" value="' + esc(q) + '" autocomplete="off" spellcheck="false" '
      + 'placeholder="N\u00b0 de bon, V/r\u00e9f\u00e9rence, n\u00b0 de commande '
      + 'ou r\u00e9f\u00e9rence pi\u00e8ce">'
    + (q ? '<button id="qvide" aria-label="Effacer la recherche">'
         + '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" '
         + 'stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
         + '</button>' : '')
    + '</div>';
}

function vueSuivi() {
  var ec = enCours();
  var att = ec.reduce(function (s, b) { return s + b.ral; }, 0);
  var h = '<section class="carte" style="margin-bottom:16px">'
    + '<div class="ct"><div><h2>Suivi des bons</h2>'
    + '<div class="sous">Cliquez sur un bon pour voir le d&eacute;tail de ses lignes</div>'
    + '</div></div>'
    + '<div class="demande"><div class="t"><h3>R&eacute;capitulatif des articles en attente'
    + '</h3><p>' + (att ? nb(att) + ' pi&egrave;ce' + (att > 1 ? 's' : '') + ' sur '
        + ec.length + ' bon' + (ec.length > 1 ? 's' : '') + ' &middot; document &agrave; '
        + 'imprimer ou &agrave; enregistrer en PDF'
      : 'Aucune pi&egrave;ce en attente : tous les bons sont livr&eacute;s.') + '</p></div>'
    + '<button class="bouton" id="recap"' + (att ? '' : ' disabled style="opacity:.4"') + '>'
    + '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" '
    + 'stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">'
    + '<path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/></svg>'
    + '&Eacute;diter le r&eacute;capitulatif</button></div></section>';

  h += '<section class="carte">' + barreRecherche();
  if (!BONS.length) {
    return h + '<div class="vide">Aucun bon enregistr&eacute; pour l\'instant.</div></section>';
  }

  var c = aplat(q);
  var vus = BONS.filter(function (b) { return correspond(b, c); });

  if (c && !vus.length) {
    return h + '<div class="vide">Aucun bon ne correspond &agrave; &laquo;&nbsp;'
      + esc(q) + '&nbsp;&raquo;.<br>Essayez un num&eacute;ro de bon, une '
      + 'V/r&eacute;f&eacute;rence, un num&eacute;ro de commande ou une '
      + 'r&eacute;f&eacute;rence pi&egrave;ce.</div></section>';
  }

  // Ce qui reste dû se lit d'abord, dans l'ordre où l'attente presse ; ce qui
  // est livré n'attend plus rien et se range derrière un dépliant. Le client
  // ouvre sa page et voit ce qu'on lui doit, pas ce qu'il a déjà reçu.
  var dus = vus.filter(function (b) { return b.statut !== 'livre'; });
  var livres = vus.filter(function (b) { return b.statut === 'livre'; });

  // Une recherche qui ne trouve que des bons livrés doit les montrer : sinon
  // l'écran répond « aucun bon en attente » alors qu'il en tient un derrière
  // un dépliant fermé, et on croit que la pièce n'existe pas.
  var deplie = ouvLivres || (!!c && !dus.length);

  if (dus.length) {
    h += '<div class="grp">En cours &middot; ' + dus.length + '</div>';
    dus.forEach(function (b) { h += ligneBonClient(b); });
  } else if (!c) {
    h += '<div class="vide" style="padding:26px 0">Aucun bon en attente&nbsp;: '
      + 'tout ce qui a &eacute;t&eacute; command&eacute; vous a &eacute;t&eacute; livr&eacute;.</div>';
  }

  if (livres.length) {
    h += '<button class="disc" id="disc" aria-expanded="' + deplie + '">'
      + '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" '
      + 'stroke-width="3" stroke-linecap="round" stroke-linejoin="round">'
      + '<path d="M9 5l7 7-7 7"/></svg>'
      + 'Bons livr&eacute;s<span class="n">' + livres.length + '</span></button>'
      + '<div id="livList"' + (deplie ? '' : ' hidden') + '>';
    livres.forEach(function (b) { h += ligneBonClient(b); });
    h += '</div>';
  }
  return h + '</section>';
}

function ligneBonClient(b) {
  var pLiv = b.du ? Math.round(b.liv / b.du * 100) : 100;
  var pPre = b.du ? Math.round(Math.min(b.liv + b.prepa, b.du) / b.du * 100) : 100;
  var estOuvert = ouvert === b.id;
  var h = '<div class="bon">'
    + '<button class="bonl" data-bon="' + b.id + '" aria-expanded="' + estOuvert + '">'
    + '<span class="bnum"><span class="nat">' + b.nat + '</span>'
      + esc(b.bon) + '</span>'
    + '<span class="bvr">' + esc(b.vref) + '</span>'
    + '<span class="jauge"><u style="width:' + pPre + '%"></u>'
      + '<i style="width:' + pLiv + '%"></i></span>'
    + '<span class="bdate">' + isoEnFr(b.date) + (b.heure ? ' ' + esc(b.heure) : '') + '</span>'
    + '<span class="bdg ' + CLS[b.statut] + '">' + LIB[b.statut] + '</span>'
    + '<span class="chev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" '
    + 'stroke="currentColor" stroke-width="2.4" stroke-linecap="round" '
    + 'stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span></button>';
  if (estOuvert) h += detailBon(b);
  return h + '</div>';
}

function detailBon(b) {
  var lg = (LIGNES[b.id] || []).slice().sort(function (x, y) { return x.ordre - y.ordre; });
  var h = '<div class="detail"><div class="tw"><table><thead><tr>'
    + '<th>R&eacute;f&eacute;rence</th><th>D&eacute;signation</th>'

  if (!lg.length) {
    h += '<tr><td colspan="6" style="color:var(--tx3)">Aucune ligne sur ce bon.</td></tr>';
  }
  lg.forEach(function (l) {
    h += '<tr><td class="ref">' + refHtml(l.ref) + '</td>'
      + '<td class="des">' + esc(l.des) + '</td>'
      + '<td class="n">' + l.du + '</td>'

      + '<td class="n">' + (l.prepa > 0 ? '<b style="color:var(--acc-hi)">' + l.prepa + '</b>'

      + '<td class="n">' + (l.ral > 0 ? '<b style="color:var(--orange)">' + l.ral + '</b>'
                                      : '<span style="color:var(--tx3)">&mdash;</span>')

  });
  h += '</tbody></table></div>'
    + '<p style="margin:12px 2px 0;font-size:11.5px;color:var(--tx3)">'
    + 'N&deg; commande ' + esc(b.cmde) + ' &middot; ' + b.nbl + ' ligne'
    + (b.nbl > 1 ? 's' : '') + ' &middot; ' + nb(b.liv) + ' pi&egrave;ce'
    + (b.liv > 1 ? 's' : '') + ' livr&eacute;e' + (b.liv > 1 ? 's' : '')
    + ' sur ' + nb(b.du)
    + (b.prepa > 0 ? ' &middot; <b style="color:var(--acc-hi)">' + nb(b.prepa)
        + ' pi&egrave;ce' + (b.prepa > 1 ? 's' : '') + ' pr&ecirc;te'
        + (b.prepa > 1 ? 's' : '') + ' &agrave; partir</b>' : '')
    + '</p></div>';
  return h;
}

function rendre() {
  var el = document.getElementById('ecran');
  var b = document.getElementById('bandeau');
  if (erreur) { b.innerHTML = erreur; b.hidden = false; } else b.hidden = true;

  if (chargement && !BONS.length) {
    el.innerHTML = '<div class="carte"><div class="vide">Chargement des '
      + 'livraisons&hellip;</div></div>';
    return;
  }
  // Le rafraîchissement automatique redessine toutes les 25 secondes : si on
  // ne reposait pas le curseur, il sauterait hors du champ au milieu d'un mot.
  var q0 = document.getElementById('q');
  var curseur = (q0 && document.activeElement === q0) ? q0.selectionStart : null;

  var h = (vue === 'suivi' ? '' : barreFiltres());
  h += vue === 'bord' ? vueBord() : vueSuivi();
  el.innerHTML = h;

  if (curseur !== null) {
    var q1 = document.getElementById('q');
    if (q1) { q1.focus(); try { q1.setSelectionRange(curseur, curseur); } catch (e2) {} }
  }
  // Pas de clignotement au rafraîchissement : on redessine, sans squelette.
  el.style.opacity = chargement ? '.6' : '1';
}

document.getElementById('nav').addEventListener('click', function (e) {
  var b = e.target.closest('[data-vue]'); if (!b) return;
  vue = b.dataset.vue;
  [].forEach.call(this.querySelectorAll('button'), function (x) {
    x.setAttribute('aria-current', String(x.dataset.vue === vue));
  });
  rendre();
});

document.getElementById('ecran').addEventListener('click', function (e) {
  var p = e.target.closest('[data-p]');
  if (p) { periode = Number(p.dataset.p); rendre(); return; }
  var t = e.target.closest('[data-tab]');
  if (t) { tableaux[t.dataset.tab] = !tableaux[t.dataset.tab]; rendre(); return; }
  if (e.target.closest('#disc')) {
    // On bascule sur place plutôt que de tout redessiner : le dépliant garde
    // son animation, et le bon déjà ouvert ne se referme pas sous le doigt.
    // On inverse ce qui est AFFICHÉ, pas la variable : une recherche a pu
    // ouvrir le dépliant d'office, et un premier clic doit alors le fermer.
    var dd = document.getElementById('disc'), ll = document.getElementById('livList');
    ouvLivres = dd.getAttribute('aria-expanded') !== 'true';
    dd.setAttribute('aria-expanded', ouvLivres);
    if (ll) ll.hidden = !ouvLivres;
    return;
  }
  if (e.target.closest('#qvide')) { q = ''; rendre(); focusRecherche(); return; }
  var b = e.target.closest('[data-bon]');
  if (b) { ouvert = ouvert === b.dataset.bon ? null : b.dataset.bon; rendre(); return; }
  if (e.target.closest('#recap')) { imprimer(); return; }
});

/* --- recherche : on redessine à chaque frappe, donc on rend le curseur ----
   rendre() remplace tout l'écran : le champ est détruit et recréé, et le
   curseur part avec lui. On le repose où il était, sinon on ne peut pas
   corriger une faute sans recliquer dans le champ à chaque lettre. */
function focusRecherche() {
  var e = document.getElementById('q');
  if (!e) return;
  e.focus();
  var n = e.value.length;
  try { e.setSelectionRange(n, n); } catch (err) {}
}

document.getElementById('ecran').addEventListener('input', function (e) {
  if (e.target.id !== 'q') return;
  q = e.target.value;
  rendre();            // rendre() repose le curseur, ici comme au rafraîchissement
});

document.getElementById('ecran').addEventListener('keydown', function (e) {
  if (e.target.id === 'q' && e.key === 'Escape' && q) {
    q = ''; rendre(); focusRecherche();
  }
});

/* --- infobulles : une seule, déplacée, jamais recréée -------------------- */
var bulle = document.getElementById('bulle');
document.getElementById('ecran').addEventListener('mousemove', function (e) {
  var m = e.target.closest('[data-tip]');
  if (!m) {
    bulle.classList.remove('on');
    var on = document.querySelector('.mark.on');
    if (on) on.classList.remove('on');
    return;
  }
  var parts = m.getAttribute('data-tip').split('|');
  bulle.innerHTML = '<b>' + parts[0] + '</b><span>' + (parts[1] || '') + '</span>';
  bulle.classList.add('on');
  var r = bulle.getBoundingClientRect();
  var x = Math.min(e.clientX + 14, window.innerWidth - r.width - 10);
  var y = Math.max(8, e.clientY - r.height - 12);
  bulle.style.left = x + 'px'; bulle.style.top = y + 'px';
});
document.getElementById('ecran').addEventListener('mouseleave', function () {
  bulle.classList.remove('on');
});

/* --- démarrage ----------------------------------------------------------- */
if (session) ouvrir();
else document.getElementById('mdp').focus();
})();
</script>
</body>
