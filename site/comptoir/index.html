<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>/* avant le premier pixel : sinon l'écran clignote au chargement */
try{var t=localStorage.getItem('sdis-theme');
if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<title>SDIS 33 — Suivi RAL</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%93%A6%3C/text%3E%3C/svg%3E">
<style>
/* ===========================================================================
   Palette — camaïeu de bleu sur anthracite

   Parti pris assumé : cette interface est sombre, point. Elle tourne sur cinq
   postes fixes au comptoir, souvent en lumière artificielle, du matin au soir.
   Un fond sombre fatigue moins l'œil dans ces conditions, et fait ressortir
   les trois seules couleurs qui portent de l'information : vert, orange, rouge.

   Tous les contrastes ci-dessous ont été calculés, pas estimés :
     texte principal / carte ....... 16,6:1
     texte secondaire / carte ....... 7,7:1
     texte tertiaire / carte ........ 4,3:1   (élément, pas du texte courant)
     blanc / bleu plein ............. 4,8:1
     blanc / vert, orange, rouge .... 5,4 / 4,7 / 5,6:1
   L'Electric Blue #0066FF ne passe qu'en APLAT — en texte sur fond sombre il
   tombe à 3,9:1. D'où deux variables distinctes : --acc pour le fond plein,
   --acc-hi pour le texte d'accent.
   =========================================================================== */
:root{
  /* surfaces, du plus profond au plus proche */
  --bg:#05070F;            /* fond de page */
  --card:#0A1024;          /* Orbit Navy — les cartes */
  --card2:#121A33;         /* surface soulevée, survol de ligne */
  --fill:#18223F;          /* fond des contrôles */

  /* texte */
  --tx:#EAF0FF; --tx2:#97A6C8; --tx3:#69789A;

  /* séparateurs */
  --sep:rgba(150,180,255,.16); --sep2:rgba(150,180,255,.08);

  /* accent — camaïeu de bleu */
  --acc:#0066FF;                        /* Electric Blue, aplats uniquement */
  --acc-hi:#5AA0FF;                     /* texte et icônes d'accent */
  --acc-lo:#0A2A63;                     /* surfaces teintées profondes */
  --acc-halo:rgba(0,102,255,.24);
  --blue:var(--acc-hi); --blue-f:var(--acc); --blue-s:var(--acc-halo);

  /* états — trois, jamais plus */
  --green:#3FD39A; --green-f:#0F7A52; --green-s:rgba(63,211,154,.14);
  --orange:#F0A93B; --orange-f:#A96410; --orange-s:rgba(240,169,59,.14);
  --red:#FF7A70;   --red-f:#C0342C;    --red-s:rgba(255,122,112,.14);

  /* élévation : sur fond sombre l'ombre seule ne suffit pas, on ajoute un
     liseré clair en haut de chaque surface, comme un reflet */
  --sh-s:0 1px 2px rgba(0,0,0,.55);
  --sh-m:0 2px 6px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.45);
  --sh-l:0 24px 64px rgba(0,0,0,.75),0 4px 12px rgba(0,0,0,.6);
  --sh-acc:0 6px 20px rgba(0,102,255,.35);
  --reflet:inset 0 1px 0 rgba(160,195,255,.09);

  /* verre */
  --glass:rgba(10,16,36,.62);
  --glass-bord:rgba(150,180,255,.14);
  --voile:rgba(3,5,12,.55);
  --verre-haut:rgba(24,34,63,.92); --verre-bas:rgba(10,16,36,.96);

  /* rayons */
  --r-s:9px; --r-m:14px; --r-l:20px;

  /* mouvement : trois durées, deux courbes, rien d'autre */
  --t-clic:140ms;
  --t-etat:220ms;
  --t-bloc:340ms;
  --e-sortie:cubic-bezier(.22,1,.36,1);
  --e-bloc:cubic-bezier(.4,0,.2,1);

  color-scheme:dark;
}

*{box-sizing:border-box}
/* sans ceci, display:flex des pastilles l'emporte sur l'attribut hidden */
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Inter",Helvetica,Arial,sans-serif;
  font-size:14px;line-height:1.47;letter-spacing:-.008em;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.num{font-variant-numeric:tabular-nums;
  font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;letter-spacing:inherit}
:focus-visible{outline:3px solid var(--blue-s);outline-offset:1px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ============ bandeau ============ */
.top{position:sticky;top:0;z-index:30;background:var(--glass);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep)}
.topin{max-width:1360px;margin:0 auto;padding:12px 24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:132px}
.brand b{font-size:19px;font-weight:600;letter-spacing:-.022em;line-height:1.2}
.brand span{font-size:11.5px;color:var(--tx3);letter-spacing:-.003em}
.srch{flex:1;min-width:230px;position:relative}
.srch input{width:100%;padding:9px 14px 9px 36px;border:none;border-radius:99px;background:var(--fill);
  color:var(--tx);font:inherit;font-size:14px;transition:box-shadow .2s}
.srch input::placeholder{color:var(--tx3)}
.srch input:focus{outline:none;box-shadow:0 0 0 4px var(--blue-s)}
.srch svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--tx3)}
.pills{display:flex;gap:8px}
.pill{border-radius:var(--r-m);padding:7px 15px;background:var(--card);box-shadow:var(--sh-s);
  display:flex;flex-direction:column;align-items:flex-start;gap:0;min-width:76px;transition:transform .18s,box-shadow .18s}
.pill:hover{transform:translateY(-1px);box-shadow:var(--sh-m)}
.pill[aria-pressed="true"]{background:var(--tx);color:var(--bg)}
.pill[aria-pressed="true"] span{color:var(--bg);opacity:.7}
.pill[aria-pressed="true"] b{color:var(--bg) !important}
.pill b{font-size:21px;font-weight:600;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.pill span{font-size:10.5px;color:var(--tx2);white-space:nowrap;letter-spacing:0}
.p-red b{color:var(--red)} .p-org b{color:var(--orange)}

.who{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 6px;border-radius:99px;
  background:var(--card);box-shadow:var(--sh-s);font-size:13px;font-weight:500;transition:box-shadow .18s}
.who:hover{box-shadow:var(--sh-m)}
.who .av{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;color:#fff;
  font-size:10.5px;font-weight:600;letter-spacing:.2px}
.who .av.anon{background:var(--tx3)}

.note{max-width:1360px;margin:0 auto;padding:12px 24px 0;font-size:12.5px;color:var(--tx2)}
.note b{color:var(--tx);font-weight:600}

/* ============ grille ============ */
.wrap{max-width:1360px;margin:0 auto;padding:14px 24px 56px;display:grid;
  grid-template-columns:minmax(272px,340px) 1fr;gap:18px;align-items:start}
@media(max-width:920px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:var(--r-l);box-shadow:var(--sh-m);overflow:hidden}

/* ============ liste ============ */
.ctrl{padding:13px 14px 12px;display:flex;flex-direction:column;gap:10px;border-bottom:.5px solid var(--sep2)}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;padding:5px 4px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--tx2);
  transition:background .2s,color .2s,box-shadow .2s;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--tx);font-weight:600;box-shadow:var(--sh-s)}
/* ---- choix BL / CMD dans la saisie manuelle -----------------------------
   Ce n'est pas un filtre comme .seg, c'est une declaration : l'operateur dit
   ce qu'il a sous les yeux, et rien d'autre ne le dira a sa place. L'etat
   choisi prend donc un aplat plein et du texte blanc — on doit le lire d'un
   coup d'oeil depuis l'autre bout du comptoir, pas le deviner. */
.seg2{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg2 button{
  flex:1;padding:6px 4px;border-radius:7px;
  font-size:12.5px;font-weight:700;letter-spacing:.04em;color:var(--tx3);
  transition:background var(--t-clic) ease,color var(--t-clic) ease,
             box-shadow var(--t-clic) ease,transform var(--t-clic) ease;
}
.seg2 button:hover{color:var(--tx2);background:var(--card2)}
.seg2 button:active{transform:scale(.97)}
.seg2 button[aria-pressed="true"]{
  background:var(--acc);color:#fff;box-shadow:var(--sh-s);
}
/* Au survol on n'eclaircit PAS le fond : --acc-hi est une couleur de TEXTE,
   du blanc dessus tomberait a 2,7:1. On souleve, le bleu ne bouge pas —
   blanc sur --acc reste a 4,8:1 dans les deux themes. */
.seg2 button[aria-pressed="true"]:hover{
  background:var(--acc);color:#fff;box-shadow:0 6px 18px rgba(0,102,255,.42);
}

select{width:100%;font:inherit;font-size:12.5px;padding:7px 10px;border:none;border-radius:9px;
  background:var(--fill);color:var(--tx2);appearance:none;cursor:pointer}
select:focus{outline:none;box-shadow:0 0 0 4px var(--blue-s)}
.lwrap{max-height:min(66vh,760px);overflow-y:auto;padding:6px}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.zcard>.disc{margin:0;padding:14px 16px;border-radius:0;font-weight:600;color:var(--tx)}
.zcard>.lwrap{border-top:.5px solid var(--sep2);max-height:min(50vh,560px)}
.empty.petit{padding:22px 16px;font-size:12.5px}
.grp{padding:12px 10px 5px;font-size:11px;font-weight:600;color:var(--tx3);
  text-transform:uppercase;letter-spacing:.05em}
.disc{width:100%;display:flex;align-items:center;gap:7px;padding:9px 10px;margin-top:4px;
  border-radius:10px;font-size:12.5px;font-weight:500;color:var(--tx2);transition:background .18s}
.disc:hover{background:var(--fill)}
.disc svg{transition:transform .28s cubic-bezier(.4,0,.2,1);color:var(--tx3)}
.disc[aria-expanded="true"] svg{transform:rotate(90deg)}
.disc .n{margin-left:auto;font-size:11.5px;color:var(--tx3);font-variant-numeric:tabular-nums}

.item{width:100%;text-align:left;padding:10px 11px;border-radius:11px;display:flex;flex-direction:column;gap:5px;
  transition:background .16s}
.item:hover{background:var(--fill)}
.item[aria-current="true"]{background:var(--blue-s)}
.r1{display:flex;align-items:baseline;gap:9px;justify-content:space-between}
/* La nature du document — BL facturé, CMD pas encore. Pour le suivi des
   restes à livrer les deux disent la même chose, donc l'étiquette reste
   sourde : elle nomme, elle n'alerte pas. Les badges de couleur de la ligne
   sont réservés à l'état, qui lui appelle un geste. */
.nat{
  flex:none;margin-right:-4px;padding:1.5px 6px;border-radius:5px;
  background:var(--fill);color:var(--tx3);
  font-size:9.5px;font-weight:700;letter-spacing:.06em;
}
.item[aria-current="true"] .nat{color:var(--tx2)}
.bn{flex:1 1 auto;font-size:14.5px;font-weight:600;letter-spacing:-.015em;
  font-variant-numeric:tabular-nums}
.vr{font-size:11.5px;color:var(--tx2);font-variant-numeric:tabular-nums}
.r2{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--tx2)}
.bar{flex:1;height:3px;border-radius:2px;background:var(--sep);overflow:hidden;min-width:26px}
.bar i{display:block;height:100%;border-radius:2px;background:var(--green);transition:width .45s cubic-bezier(.4,0,.2,1)}
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff !important;
  font-weight:700;flex:none;line-height:1}
.av.sm{width:20px;height:20px;font-size:9px;letter-spacing:.2px}

/* ---- scrollbars discrètes ---- */
*{scrollbar-width:thin;scrollbar-color:transparent transparent}
*:hover{scrollbar-color:var(--sep) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:transparent;border-radius:99px;border:2px solid transparent;
  background-clip:content-box;transition:background-color .2s}
:hover::-webkit-scrollbar-thumb{background:var(--sep);background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--tx3);background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}

/* ============ badges : fond plein, texte blanc ============ */
.bdg{display:inline-block;font-size:11px;font-weight:600;padding:2.5px 9px;border-radius:99px;
  white-space:nowrap;letter-spacing:0;color:#fff !important;line-height:1.45}
.g{background:var(--green-f)}
.o{background:var(--orange-f)}
.r{background:var(--red-f)}
.b{background:var(--blue-f)}
.rv{background:#6A4FD0}

/* ============ détail ============ */
.dh{padding:22px 24px 18px;display:flex;gap:20px 30px;align-items:flex-start;flex-wrap:wrap;
  border-bottom:.5px solid var(--sep2)}
.meta{display:flex;gap:30px;flex-wrap:wrap;align-items:flex-start;flex:1 1 auto;min-width:0}
.n0{background:var(--tx3);color:#fff}
.kv{display:flex;flex-direction:column;gap:3px}
.kv span{font-size:11px;color:var(--tx3);letter-spacing:-.002em}
.kv b{font-size:15px;font-weight:600;letter-spacing:-.012em;font-variant-numeric:tabular-nums;
  display:flex;align-items:center;gap:6px}
.kv.big b{font-size:27px;letter-spacing:-.028em;line-height:1.1}
.kv.acc b{color:var(--blue)}
.acts{margin-left:auto;display:flex;gap:9px;align-items:center}
.btn{padding:8px 17px;border-radius:99px;background:var(--fill);font-size:13.5px;font-weight:500;
  transition:transform .16s,filter .16s,opacity .16s}
.btn:hover:not(:disabled){transform:scale(1.03)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.pri{background:var(--blue);color:#fff;font-weight:600}
.btn:disabled{opacity:.35;cursor:not-allowed}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11px;font-weight:600;color:var(--tx3);text-align:left;padding:10px 14px;
  border-bottom:.5px solid var(--sep);white-space:nowrap;letter-spacing:-.002em;
  text-transform:uppercase;letter-spacing:.04em}
td{padding:11px 14px;border-bottom:.5px solid var(--sep2);vertical-align:middle}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr{transition:background .2s}
tr.done td{color:var(--tx2)}
tr.flash td{background:var(--blue-s)}
.ref{font-weight:600;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-.004em}
.ref em{font-style:normal;color:var(--tx3);font-weight:400;margin:0 1px}
.des{color:var(--tx2);font-size:12.5px}
.trace{display:block;font-size:11px;color:var(--tx3);margin-top:2px}
.step{display:inline-flex;align-items:center;background:var(--fill);border-radius:99px;padding:2px}
.step button{width:26px;height:26px;border-radius:50%;font-size:16px;line-height:1;color:var(--tx2);
  display:grid;place-items:center;transition:background .16s,color .16s,transform .16s}
.step button:hover:not(:disabled){background:var(--card);color:var(--blue);box-shadow:var(--sh-s)}
.step button:active:not(:disabled){transform:scale(.9)}
.step button:disabled{opacity:.28;cursor:not-allowed}
.step .v{min-width:32px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;font-size:13.5px}
/* correction discrète de la quantité due : rien ne bouge tant qu'on ne survole pas */
.du{font:inherit;font-variant-numeric:tabular-nums;padding:2px 7px;border-radius:7px;
  color:inherit;transition:background .15s,box-shadow .15s}
tr:hover .du{background:var(--fill)}
.du:hover{box-shadow:inset 0 0 0 1px var(--sep)}
.du.corr{font-weight:600;box-shadow:inset 0 0 0 1px var(--blue-f)}
.duin{width:56px;font:inherit;font-weight:600;text-align:right;padding:2px 7px;border:none;
  border-radius:7px;background:var(--fill);color:var(--tx);font-variant-numeric:tabular-nums;
  box-shadow:0 0 0 3px var(--blue-s)}
.duin:focus{outline:none}
.ral{font-weight:600;font-variant-numeric:tabular-nums}
.ral.z{color:var(--tx3);font-weight:400}
.foot{padding:14px 24px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;
  font-size:12.5px;color:var(--tx2);border-top:.5px solid var(--sep2)}
.empty{padding:72px 24px;text-align:center;color:var(--tx3);font-size:13.5px}

/* ============ modale ============ */
.ov{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;
  background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  animation:fade .22s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
.sheet{background:var(--card);border-radius:22px;box-shadow:var(--sh-l);width:min(400px,100%);
  padding:28px 26px 22px;text-align:center;animation:pop .28s cubic-bezier(.22,1,.36,1)}
.sheet h3{margin:0 0 5px;font-size:19px;font-weight:600;letter-spacing:-.02em}
.sheet p{margin:0 0 20px;font-size:13.5px;color:var(--tx2)}
.code{width:100%;text-align:center;font-size:34px;font-weight:600;letter-spacing:.32em;text-indent:.32em;
  padding:14px 0;border:none;border-radius:14px;background:var(--fill);color:var(--tx);
  font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.code:focus{outline:none;box-shadow:0 0 0 4px var(--blue-s)}
.code.bad{animation:shake .4s;box-shadow:0 0 0 4px var(--red-s)}
@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-4px)}}
.err{min-height:19px;font-size:12.5px;color:var(--red);margin:9px 0 0;font-weight:500}
.sheet .row{display:flex;gap:9px;margin-top:14px}
.sheet .row .btn{flex:1;justify-content:center;text-align:center}
.hint{margin-top:16px;padding-top:14px;border-top:.5px solid var(--sep2);
  font-size:11.5px;color:var(--tx3);line-height:1.7}

.btn.ic{padding:8px;border-radius:50%;display:grid;place-items:center;background:var(--card);
  box-shadow:var(--sh-s);color:var(--tx2);flex:none}
.btn.ic:hover{color:var(--blue);box-shadow:var(--sh-m)}
.alerte{max-width:1360px;margin:12px auto 0;padding:11px 16px;border-radius:12px;
  background:var(--red-f);color:#fff;font-size:13px;font-weight:500;line-height:1.5;
  width:calc(100% - 48px);box-sizing:border-box}
.p-b b{color:var(--blue)}
.revs{padding:6px 10px 14px}
.rev{padding:14px 14px 12px;border-bottom:.5px solid var(--sep2);display:flex;
  flex-direction:column;gap:9px}
.rev:last-child{border-bottom:none}
.rev-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--tx3)}
.rev-bon{font-weight:600;color:var(--tx);font-size:13.5px;font-variant-numeric:tabular-nums}
.rev-vref{font-variant-numeric:tabular-nums}
.rev-des{color:var(--tx2)}
.rev-mid{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rev-lbl{font-size:10.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em}
.rev-ocr{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px;
  padding:3px 9px;border-radius:8px;background:var(--fill);color:var(--tx2)}
.rev-fl{color:var(--tx3)}
.rev-prop{font-weight:600;font-size:14px;letter-spacing:-.004em}
.rev-act{display:flex;gap:8px}
.rev .ok,.rev .ko{display:inline-flex;align-items:center;gap:7px;padding:7px 15px;
  border-radius:99px;font-size:13px;font-weight:600;transition:transform .16s}
.rev .ok{background:var(--green-f);color:#fff}
.rev .ko{background:var(--fill);color:var(--tx2)}
.rev .ok:hover,.rev .ko:hover{transform:scale(1.03)}
.rev .ok:active,.rev .ko:active{transform:scale(.97)}
.revin{font:inherit;font-size:14px;font-weight:600;padding:5px 11px;border:none;border-radius:9px;
  background:var(--fill);color:var(--tx);min-width:210px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;box-shadow:0 0 0 3px var(--blue-s)}
.revin:focus{outline:none}

/* ===========================================================================
   Colonne d'outils des lignes — poignée de déplacement et corbeille

   Discrètes par défaut : au comptoir, l'œil doit tomber sur la référence et
   la quantité, pas sur des icônes. Elles apparaissent au survol de la ligne,
   et restent visibles en permanence sur écran tactile.
   =========================================================================== */
th.tp,td.tp{width:52px;padding-left:14px;padding-right:0;white-space:nowrap}
.poignee,.corb{opacity:0;transition:opacity .15s,color .15s,transform .15s;color:var(--tx3)}
tr:hover .poignee,tr:hover .corb{opacity:.75}
.poignee{cursor:grab;font-size:11px;letter-spacing:-2px;user-select:none;
  display:inline-block;vertical-align:middle;margin-right:2px}
.poignee:active{cursor:grabbing}
.poignee:hover{opacity:1;color:var(--tx2)}
.corb{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;
  vertical-align:middle}
.corb:hover{opacity:1;color:#fff;background:var(--red-f);transform:scale(1.08)}
tr.drag td{opacity:.4}
tr.sur-haut td{box-shadow:inset 0 2px 0 var(--blue)}
tr.sur-bas td{box-shadow:inset 0 -2px 0 var(--blue)}

/* ============ ligne ajoutée à la volée sur un bon existant ============ */
.ajl td{background:var(--card2)}
.si{font:inherit;font-size:13px;width:100%;padding:6px 10px;border:none;border-radius:9px;
  background:var(--fill);color:var(--tx);transition:box-shadow .15s}
.si:focus{outline:none;box-shadow:0 0 0 3px var(--blue-s)}
.si.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  font-weight:600;letter-spacing:-.004em}
.si.n{text-align:right;font-variant-numeric:tabular-nums}
.serr{margin:10px 0 0;font-size:12.5px;color:var(--red);font-weight:500}

/* ============ pied du tableau ============ */
.tfoot{padding:12px 24px 4px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.tnote{font-size:11.5px;color:var(--tx3)}

/* ============ saisie manuelle d'un bon ============ */
.saisie{padding:20px 24px 24px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:14px 18px;
  margin-bottom:22px}
.ch{display:flex;flex-direction:column;gap:5px}
.ch>span{font-size:11px;color:var(--tx3);letter-spacing:-.002em}
.ch>span i{font-style:normal;color:var(--tx3);opacity:.75}
.ch input,.ch select{font:inherit;font-size:14px;font-weight:500;padding:8px 11px;border:none;
  border-radius:10px;background:var(--fill);color:var(--tx);width:100%;
  transition:box-shadow .15s}
.ch input:focus,.ch select:focus{outline:none;box-shadow:0 0 0 3px var(--blue-s)}
.slignes table{font-size:13px}
.slignes th{padding:8px 8px}
.slignes td{padding:5px 8px;border-bottom:none}
.sdel{width:26px;height:26px;border-radius:50%;font-size:17px;line-height:1;color:var(--tx3);
  display:grid;place-items:center;transition:background .15s,color .15s}
.sdel:hover:not(:disabled){background:var(--red-f);color:#fff}
.sdel:disabled{opacity:.25;cursor:not-allowed}

/* ============ divers ============ */
.av.md{width:24px;height:24px;font-size:10.5px;letter-spacing:.2px}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
.rev-motif{font-size:11.5px;color:var(--tx3);flex-basis:100%}
/* Boutons secondaires de l'écran de contrôle (« Garder », « Modifier ») :
   même gabarit que le bouton vert, mais en retrait — l'action recommandée
   doit rester la seule à sauter aux yeux. */
.rev .neutre{display:inline-flex;align-items:center;gap:7px;padding:7px 15px;border-radius:99px;
  font-size:13px;font-weight:600;background:var(--fill);color:var(--tx2);
  transition:transform .16s,color .16s}
.rev .neutre:hover{transform:scale(1.03);color:var(--tx)}
.rev .neutre:active{transform:scale(.97)}
/* V/référence et n° de commande : corrigeables d'un clic, comme la quantité
   due. Discret au repos — ce sont des valeurs à lire, pas des champs. */
.ed{font:inherit;font-weight:inherit;font-size:inherit;letter-spacing:inherit;
  font-variant-numeric:tabular-nums;color:inherit;padding:1px 7px;margin-left:-7px;
  border-radius:7px;transition:background .15s,box-shadow .15s}
.kv:hover .ed{background:var(--fill)}
.ed:hover{box-shadow:inset 0 0 0 1px var(--sep)}
.ed.corr{box-shadow:inset 0 0 0 1px var(--blue-f)}
.entin{font:inherit;font-size:15px;font-weight:600;letter-spacing:-.012em;
  font-variant-numeric:tabular-nums;width:150px;padding:1px 7px;margin-left:-7px;
  border:none;border-radius:7px;background:var(--fill);color:var(--tx);
  box-shadow:0 0 0 3px var(--blue-s)}
.entin:focus{outline:none}

/* la pastille de l'opérateur et l'horodatage se touchaient */
.trace{display:flex;align-items:center;gap:5px}
.btn.nouv{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:var(--card);
  box-shadow:var(--sh-s);font-size:13px;font-weight:600;color:var(--tx2);flex:none;
  white-space:nowrap}
.btn.nouv:hover{color:var(--blue);box-shadow:var(--sh-m)}
.btn.nouv[aria-pressed="true"]{background:var(--blue-f);color:#fff}
@media (hover:none){.poignee,.corb{opacity:1}}


/* ===========================================================================
   Couche d'habillage — élévation, verre, mouvement

   Ces règles arrivent après toutes les autres : elles ne redéfinissent pas la
   mise en page, elles la soulèvent. Chaque effet est là pour dire quelque
   chose — ce qui est au-dessus, ce qui répond au doigt, ce qui vient de
   changer — jamais pour décorer.
   =========================================================================== */

/* ---- hiérarchie par la graisse, quatre niveaux ------------------------- */
/* H1 la valeur mise en avant, H2 le titre de carte, H3 la ligne de liste,
   H4 l'étiquette. C'est la graisse qui range, pas la couleur. */
.kv.big b{font-weight:700;letter-spacing:-.03em}
.rev-bon,.bn,.hjd{font-weight:600}
.kv b,.rev-prop{font-weight:600}
.kv span,.rev-lbl,th,.hjn,.tnote,.ch>span{font-weight:500}
h1,h2,h3{margin:0}

/* ---- fond de page : une nappe de bleu très diffuse, pour que le noir ne
        soit pas plat. Fixe, donc elle ne bouge pas au défilement. ---------- */
body{
  background:
    radial-gradient(1100px 620px at 12% -8%, rgba(0,102,255,.16), transparent 62%),
    radial-gradient(900px 520px at 92% 4%, rgba(90,160,255,.10), transparent 58%),
    var(--bg);
  background-attachment:fixed;
}

/* ---- verre : la barre du haut et les modales flottent au-dessus --------- */
.top{
  background:var(--glass);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  backdrop-filter:blur(22px) saturate(180%);
  border-bottom:1px solid var(--glass-bord);
  box-shadow:0 8px 32px rgba(0,0,0,.45);
}
.ov{
  background:var(--voile);
  -webkit-backdrop-filter:blur(14px) saturate(140%);
  backdrop-filter:blur(14px) saturate(140%);
}
.sheet{
  background:linear-gradient(180deg,var(--verre-haut),var(--verre-bas));
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  backdrop-filter:blur(28px) saturate(180%);
  border:1px solid var(--glass-bord);
  box-shadow:var(--sh-l),var(--reflet);
}

/* ---- cartes : liseré de reflet en haut + ombre portée ------------------- */
.card{
  border:1px solid var(--sep2);
  box-shadow:var(--sh-m),var(--reflet);
  background:linear-gradient(180deg,var(--card2),transparent 180px),var(--card);
}

/* ---- boutons : lévitation au survol, enfoncement au clic ---------------- */
.btn{
  box-shadow:var(--sh-s),var(--reflet);
  transition:transform var(--t-clic) ease, box-shadow var(--t-clic) ease,
             background var(--t-clic) ease, color var(--t-clic) ease,
             opacity var(--t-clic) ease;
}
.btn:hover:not(:disabled){transform:translateY(-1px) scale(1.02);box-shadow:var(--sh-m),var(--reflet)}
.btn:active:not(:disabled){transform:translateY(0) scale(.975)}
.btn.pri{
  background:linear-gradient(180deg,#2E82FF,var(--acc));
  box-shadow:var(--sh-acc),var(--reflet);
}
.btn.pri:hover:not(:disabled){box-shadow:0 10px 28px rgba(0,102,255,.5),var(--reflet)}
.btn.ic:hover{color:var(--acc-hi)}
.btn.ic[aria-pressed="true"]{background:var(--acc);color:#fff;box-shadow:var(--sh-acc)}
.btn.nouv[aria-pressed="true"]{background:var(--acc);color:#fff;box-shadow:var(--sh-acc)}
.step button:hover:not(:disabled){background:var(--acc-lo);color:var(--acc-hi)}

/* ---- lignes de liste : le survol soulève, la sélection s'ancre ---------- */
.item{
  transition:background var(--t-clic) ease, transform var(--t-clic) ease,
             box-shadow var(--t-clic) ease;
}
.item:hover{background:var(--card2);transform:translateX(2px)}
.item[aria-current="true"]{
  background:linear-gradient(90deg,var(--acc-lo),transparent);
  box-shadow:inset 3px 0 0 var(--acc);
}
tbody tr:hover td{background:rgba(90,160,255,.05)}
tr.flash td{background:var(--acc-halo)}

/* ---- champs : anneau de focus bleu -------------------------------------- */
.si:focus,.ch input:focus,.ch select:focus,.code:focus,.duin,.revin,.entin{
  box-shadow:0 0 0 3px var(--acc-halo);
}
.srch input:focus{outline:none}
.srch:focus-within{box-shadow:0 0 0 3px var(--acc-halo);border-radius:99px}

/* ---- pastilles du haut -------------------------------------------------- */
.pill{transition:transform var(--t-clic) ease, box-shadow var(--t-clic) ease,
  background var(--t-clic) ease}
.pill:hover{transform:translateY(-1px);box-shadow:var(--sh-m)}
/* Une pastille active garde SA couleur, en aplat plein : c'est ce qui dit
   quel filtre est en cours sans avoir à lire l'étiquette. L'ancienne règle
   inversait en blanc — illisible et hors sujet sur fond sombre. */
.pill[aria-pressed="true"]{color:#fff;box-shadow:var(--sh-m),var(--reflet)}
.pill[aria-pressed="true"] b,
.pill[aria-pressed="true"] span{color:#fff !important;opacity:1}
.pill[aria-pressed="true"] span{opacity:.82}
.p-red[aria-pressed="true"]{background:var(--red-f)}
.p-org[aria-pressed="true"]{background:var(--orange-f)}
.p-b[aria-pressed="true"]{background:var(--acc)}

/* ---- apparition du panneau de droite ------------------------------------ */
@keyframes monte{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#detail>.dh,#detail>.tw,#detail>.histo,#detail>.saisie,#detail>.revs{
  animation:monte var(--t-etat) var(--e-sortie) both;
}

/* ===========================================================================
   Historique des livraisons d'un bon
   =========================================================================== */
.histo{padding:6px 12px 18px}
.hj{
  display:flex;align-items:baseline;gap:12px;margin:16px 12px 8px;
  padding-bottom:7px;border-bottom:1px solid var(--sep2);
}
.hjd{font-size:13.5px;color:var(--tx);letter-spacing:-.01em}
.hjn{font-size:11.5px;color:var(--tx3);margin-left:auto}
.hm{
  display:grid;grid-template-columns:52px minmax(120px,auto) 1fr auto auto 24px;
  gap:12px;align-items:center;padding:9px 12px;border-radius:var(--r-s);
  transition:background var(--t-clic) ease;
}
.hm:hover{background:var(--card2)}
.hh{font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums}
.hr{font-size:13px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.hd{font-size:12.5px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hq{
  font-size:12.5px;color:var(--tx2);font-variant-numeric:tabular-nums;white-space:nowrap;
  background:var(--fill);padding:3px 10px;border-radius:99px;
}
.hq i{font-style:normal;color:var(--tx3);margin:0 5px}
.hv{
  font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;
  min-width:34px;text-align:right;
}
.hv.p{color:var(--green)}
.hv.n{color:var(--red)}
.ho{display:inline-flex}

/* ---- respect du réglage système ---------------------------------------- */
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .item:hover,.btn:hover:not(:disabled){transform:none}
}


/* ===========================================================================
   Thème clair

   Seules les variables changent : pas une seule règle de mise en page n'est
   dupliquée. Les quatre aplats (bleu, vert, orange, rouge) sont identiques
   dans les deux thèmes — le blanc dessus passe partout, vérifié au calcul :
     blanc / bleu 4,8:1 · vert 5,4 · orange 4,7 · rouge 5,6
   et en clair : texte principal 18,3:1 · secondaire 7,0 · accent 7,0.

   Trois états possibles : « sombre », « clair », et rien — auquel cas on suit
   le réglage du système. C'est le défaut : un poste réglé en clair ouvre
   l'outil en clair, sans que personne n'ait à toucher au bouton.
   =========================================================================== */
:root[data-theme="light"]{
  --bg:#EEF2FA; --card:#FFFFFF; --card2:#F4F7FD; --fill:#E7EDF9;
  --tx:#0B1526; --tx2:#4A5A76; --tx3:#7A8AA6;
  --sep:rgba(11,40,90,.16); --sep2:rgba(11,40,90,.08);
  --acc:#0066FF; --acc-hi:#0B4FCC; --acc-lo:#DDE8FF; --acc-halo:rgba(0,102,255,.20);
  --green:#0F7A52; --orange:#A96410; --red:#C0342C;
  --sh-s:0 1px 2px rgba(16,40,80,.07);
  --sh-m:0 2px 6px rgba(16,40,80,.07),0 12px 32px rgba(16,40,80,.09);
  --sh-l:0 24px 64px rgba(16,40,80,.22),0 4px 12px rgba(16,40,80,.12);
  --sh-acc:0 6px 20px rgba(0,102,255,.28);
  --reflet:inset 0 1px 0 rgba(255,255,255,.9);
  --glass:rgba(255,255,255,.62);
  --glass-bord:rgba(11,40,90,.10);
  --voile:rgba(20,40,80,.30);
  --verre-haut:rgba(255,255,255,.96); --verre-bas:rgba(238,243,252,.98);
  color-scheme:light;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#EEF2FA; --card:#FFFFFF; --card2:#F4F7FD; --fill:#E7EDF9;
    --tx:#0B1526; --tx2:#4A5A76; --tx3:#7A8AA6;
    --sep:rgba(11,40,90,.16); --sep2:rgba(11,40,90,.08);
    --acc:#0066FF; --acc-hi:#0B4FCC; --acc-lo:#DDE8FF; --acc-halo:rgba(0,102,255,.20);
    --green:#0F7A52; --orange:#A96410; --red:#C0342C;
    --sh-s:0 1px 2px rgba(16,40,80,.07);
    --sh-m:0 2px 6px rgba(16,40,80,.07),0 12px 32px rgba(16,40,80,.09);
    --sh-l:0 24px 64px rgba(16,40,80,.22),0 4px 12px rgba(16,40,80,.12);
    --sh-acc:0 6px 20px rgba(0,102,255,.28);
    --reflet:inset 0 1px 0 rgba(255,255,255,.9);
    --glass:rgba(255,255,255,.62);
    --glass-bord:rgba(11,40,90,.10);
    --voile:rgba(20,40,80,.30);
    --verre-haut:rgba(255,255,255,.96); --verre-bas:rgba(238,243,252,.98);
    color-scheme:light;
  }
}

/* ---- la nappe de fond, plus franche -------------------------------------
   Trois foyers de couleur au lieu de deux, posés hors cadre pour qu'on ne
   voie que leur diffusion. Fixe : elle ne défile pas avec le contenu. */
body{
  background:
    radial-gradient(1100px 700px at 8% -12%,  rgba(0,102,255,.30),  transparent 60%),
    radial-gradient(900px 620px at 96% -4%,   rgba(90,160,255,.22), transparent 58%),
    radial-gradient(1000px 800px at 50% 112%, rgba(0,72,190,.22),   transparent 62%),
    var(--bg) !important;
  background-attachment:fixed !important;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]) body{
    background:
      radial-gradient(1100px 700px at 8% -12%,  rgba(0,102,255,.16),  transparent 60%),
      radial-gradient(900px 620px at 96% -4%,   rgba(90,160,255,.14), transparent 58%),
      radial-gradient(1000px 800px at 50% 112%, rgba(0,72,190,.10),   transparent 62%),
      var(--bg) !important;
  }
}
:root[data-theme="light"] body{
  background:
    radial-gradient(1100px 700px at 8% -12%,  rgba(0,102,255,.16),  transparent 60%),
    radial-gradient(900px 620px at 96% -4%,   rgba(90,160,255,.14), transparent 58%),
    radial-gradient(1000px 800px at 50% 112%, rgba(0,72,190,.10),   transparent 62%),
    var(--bg) !important;
}

/* ---- verre dépoli, plus lisible -----------------------------------------
   Le flou seul ne se voit pas : ce qui fait le verre, c'est le flou PLUS un
   filet clair en haut de la surface, qui imite l'arête d'une plaque. */
.top,.ov,.sheet,.carte,.card,.cle{
  -webkit-backdrop-filter:blur(26px) saturate(190%);
  backdrop-filter:blur(26px) saturate(190%);
}
.card,.carte{
  position:relative;
  background:
    linear-gradient(150deg,rgba(150,190,255,.14),rgba(150,190,255,.02) 42%,transparent 70%),
    var(--card);
  border:1px solid var(--glass-bord);
  box-shadow:var(--sh-m),var(--reflet);
}
/* le reflet oblique : une bande claire très diffuse en haut à gauche */
.card::before,.carte::before{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.10),transparent 38%);
}
.card>*,.carte>*{position:relative}
.top{border-bottom:1px solid var(--glass-bord)}

/* ---- le bouton de thème -------------------------------------------------- */
.theme{
  display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;
  background:var(--card);box-shadow:var(--sh-s),var(--reflet);color:var(--tx2);
  flex:none;transition:transform var(--t-clic) ease,box-shadow var(--t-clic) ease,
  color var(--t-clic) ease;
}
.theme:hover{color:var(--acc-hi);box-shadow:var(--sh-m),var(--reflet);transform:translateY(-1px)}
.theme:active{transform:translateY(0) scale(.94)}
.theme svg{display:block}

/* ===========================================================================
   Préparation et livraison

   Deux temps, deux signes visuels qu'on ne confond pas :
     le PRÉPARÉ est bleu — c'est l'action en cours, elle appelle un geste ;
     le LIVRÉ est vert — c'est acquis, il n'y a plus rien à faire.
   =========================================================================== */

/* ---- jauge à deux niveaux dans la liste ---------------------------------
   Le trait clair dessous montre jusqu'où la marchandise est prête ; le trait
   plein par-dessus, jusqu'où elle est réellement partie. L'écart entre les
   deux, c'est ce qui attend sur l'étagère. */
.bar{position:relative}
.bar u{position:absolute;inset:0 auto 0 0;display:block;height:100%;border-radius:2px;
  background:var(--acc);opacity:.45;transition:width var(--t-bloc) var(--e-bloc)}
.bar i{position:relative;z-index:1}
.item.s-late .bar i{background:var(--red)}
.item.s-warn .bar i{background:var(--orange)}
.item.s-prepa .bar i{background:var(--green)}

/* ---- ligne en préparation dans le tableau du bon -------------------------
   Pas de fond teinté : la ligne garde le survol ordinaire, comme toutes les
   autres. Le badge « En préparation » et la pastille de quantité suffisent à
   dire l'état — un aplat coloré derrière le texte, sur une ligne qu'on vient
   de toucher, ressemble à une erreur plus qu'à une information. */
.pastille{
  margin-left:7px;padding:1px 7px;border-radius:99px;background:var(--acc);color:#fff;
  font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.6;
}
.liv{font-weight:600;font-variant-numeric:tabular-nums;color:var(--green)}
.liv.z{color:var(--tx3);font-weight:400}
/* Réceptionné : la couleur du badge « Réceptionné », éclaircie pour le texte. */
.rec{font-weight:600;font-variant-numeric:tabular-nums;color:#9C86F0;cursor:default}
:root[data-theme="light"] .rec{color:#5B3FC4}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .rec{color:#5B3FC4}}
.rec.z{color:var(--tx3) !important;font-weight:400}
.cpt.rc b{color:#9C86F0}
:root[data-theme="light"] .cpt.rc b{color:#5B3FC4}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .cpt.rc b{color:#5B3FC4}}
/* Corbeille du bon : en bas à droite, discrète jusqu'au survol. */
.suppbon{margin-left:auto;display:inline-grid;place-items:center;width:30px;height:30px;
  border-radius:50%;color:var(--tx3);transition:color .15s,background .15s,transform .15s}
.suppbon:hover{color:#fff;background:var(--red-f);transform:scale(1.06)}
.ch input:disabled{opacity:.35;cursor:not-allowed}
input.maj{text-transform:uppercase}
input.maj::placeholder{text-transform:none}

/* ---- pied du bon : les trois chiffres de l'état ------------------------- */
.foot{gap:22px}
.cpt{display:inline-flex;align-items:baseline;gap:6px}
.cpt b{font-size:16px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums}
.cpt.pre b{color:var(--acc-hi)}
.cpt.res b{color:var(--orange)}

/* ---- fenêtre de confirmation de livraison ------------------------------- */
.sheet.large{width:min(560px,100%);text-align:left}
.sheet.large h3,.sheet.large>p{text-align:center}
.clist{
  max-height:46vh;overflow:auto;margin:6px 0 0;padding:4px 0;
  border-top:1px solid var(--sep2);border-bottom:1px solid var(--sep2);
}
.cl{
  display:grid;grid-template-columns:minmax(110px,auto) 1fr auto;gap:12px;
  align-items:center;padding:8px 4px;border-bottom:1px solid var(--sep2);
}
.cl:last-child{border-bottom:none}
.clr{font-size:13px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.clr em{font-style:normal;color:var(--tx3);font-weight:400;margin:0 1px}
.cld{font-size:12.5px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.clq{
  min-width:34px;text-align:center;padding:3px 10px;border-radius:99px;
  background:var(--acc);color:#fff;font-size:12.5px;font-weight:700;
  font-variant-numeric:tabular-nums;
}
.cltot{margin:14px 0 0;text-align:center;font-size:13px;color:var(--tx2)}
.cltot b{color:var(--tx);font-weight:700;font-variant-numeric:tabular-nums}
.sheet.large .row .btn{flex:1}

/* ===========================================================================
   Impression — feuilles remises au client

   Le bon de livraison (.bl) est calqué au point près sur le devis Barrault :
   même bandeau, même cadre destinataire à 298pt, même grille de colonnes à
   302,8pt, mêmes cases grises #EBEBEB séparées par 1,8pt de blanc. D'où le
   positionnement absolu en points plutôt qu'une mise en page fluide : la
   fidélité prime, et le format A4 est fixe de toute façon.

   Le récapitulatif (.rec) garde sa mise en page simple, il n'est pas destiné
   au même usage.
   =========================================================================== */
#print{display:none}
@media print{
  @page{size:A4 portrait;margin:0}
  /* Sans cela le navigateur peint les marges dans le ton sombre déclaré par
     color-scheme : une bande noire sur les bords de chaque page. */
  :root{color-scheme:light}
  /* La nappe de fond du theme est posee sur « :root[data-theme="light"] body »
     avec !important : une regle « body » toute simple, meme !important, perd
     sur la specificite et le bleu partait a l'imprimante. On repete :root
     pour passer devant, sans dependre de l'ordre des blocs. Et la feuille
     elle-meme porte du blanc opaque : quoi qu'il y ait derriere, le papier
     reste blanc. */
  html,body,:root:root:root body{
    background:#fff !important;
    background-image:none !important;
    background-attachment:scroll !important;
  }
  #print,#print .pf{background:#fff !important}
  body>*{display:none !important}
  #print{display:block !important;color:#000}

  /* ---------- bon de livraison ---------- */
  #print .bl{position:relative;width:595pt;height:841pt;overflow:hidden;
    font:8pt/1.2 Arial,Helvetica,"Liberation Sans",sans-serif;color:#000}
  #print .bl .hz{position:relative;height:302.8pt}
  #print .bl .ban{position:absolute;left:4pt;top:4pt;width:582pt;height:auto}
  #print .bl .t{position:absolute;white-space:nowrap;line-height:1.05}
  #print .bl .cbz{position:absolute;left:469pt;top:237pt;width:117pt;height:13pt}
  #print .bl .cb{width:100%;height:100%;display:block}

  /* cases grises du bandeau d'informations et du pavé de synthèse */
  #print .bl .ic{position:absolute;top:266.8pt;height:13.4pt;line-height:13.4pt;
    background:#EBEBEB;font-size:8pt;text-align:center;overflow:hidden;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print .bl .iv{position:absolute;top:281pt;text-align:center;line-height:1.15;
    white-space:nowrap;overflow:hidden}

  /* tableau des lignes : les « bordures » du devis sont en réalité
     1,8pt de blanc entre deux aplats gris */
  #print .bl table.ln{border-collapse:separate;border-spacing:1.8pt 0;
    table-layout:fixed;width:572.4pt;margin-left:15.2pt}
  #print .bl table.ln th{background:#EBEBEB;height:14.3pt;font-size:9pt;
    font-weight:400;text-align:center;padding:0;vertical-align:middle;border:none;
    color:#000;text-transform:none;letter-spacing:0;white-space:nowrap;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print .bl table.ln th:nth-child(1){width:90pt}
  #print .bl table.ln th:nth-child(2){width:290pt}
  #print .bl table.ln th:nth-child(3),
  #print .bl table.ln th:nth-child(4){width:93.5pt}
  #print .bl table.ln thead{display:table-header-group}
  #print .bl table.ln tr{page-break-inside:avoid}
  /* Le corps du tableau monte de 8 a 9pt : ce papier se lit debout, a bout de
     bras, souvent sur un quai. Un point de plus ne change pas la mise en page
     du devis (les colonnes sont fixes) mais change la lecture. */
  #print .bl table.ln td{padding:1.8pt 0 1.8pt 11.2pt;vertical-align:top;font-size:9pt;
    border:none;color:#000}
  #print .bl table.ln td.rf{font-weight:bold;white-space:nowrap;padding-left:1pt}
  #print .bl table.ln td.q{text-align:right;padding-right:24pt;padding-left:0;
    white-space:nowrap}
  #print .bl table.ln tr.ref td{padding-top:4pt;font-size:9pt}
  #print .bl table.ln tr.zn td{background:#EBEBEB;font-weight:bold;font-size:8.8pt;
    letter-spacing:.03em;padding:3.4pt 0 3.4pt 4pt;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}

  /* La respiration entre deux sections. Une ligne vide, rien d'autre : pas de
     fond, pas de trait — c'est l'absence qui separe. */
  #print .bl table.ln tr.esp td{padding:0;height:9pt;background:none;border:none}

  /* pavé de synthèse : à la hauteur du pavé de totaux du devis quand le
     tableau le permet, à la suite des lignes sinon */
  #print .bl .edite{position:absolute;left:17pt;top:612pt;font-size:7pt;color:#444}

  /* ---------- cadre a faire tamponner ----------
     En bas a droite, sous le tableau : les lignes s'arretent a 590pt, la zone
     est donc libre quelle que soit la longueur du bon. Assez grand pour un
     tampon d'administration (les cachets de service font couramment 45mm),
     assez sobre pour ne pas concurrencer le contenu. */
  #print .bl .tmp{
    position:absolute;left:390pt;top:648pt;width:190pt;height:104pt;
    border:.8pt solid #000;
  }
  #print .bl .tmp .tt{
    background:#EBEBEB;font-size:7.2pt;font-weight:bold;letter-spacing:.03em;
    text-align:center;padding:3pt 2pt;border-bottom:.8pt solid #000;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }



  /* ---------- récapitulatif ---------- */
  #print .rec{padding:14mm 12mm;
    font:12px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  #print .pf{page-break-after:always}
  #print .pf:last-child{page-break-after:auto}
  #print .rec .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;
    border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:13px}
  #print .rec .pmarq{font-size:16px;font-weight:700;letter-spacing:.2px}
  #print .rec .psub{font-size:11px;color:#444;margin-top:2px}
  #print .rec .ptit{font-size:14px;font-weight:700;text-align:right;max-width:46%}
  #print .rec .pmeta{display:flex;flex-wrap:wrap;gap:4px 26px;margin-bottom:14px;font-size:11.5px}
  #print .rec .pmeta span{color:#555}
  #print .rec .pmeta b{font-weight:700}
  #print .rec table{width:100%;border-collapse:collapse;font-size:11.5px;table-layout:fixed}
  #print .rec th:nth-child(1),#print .rec td:nth-child(1){width:26%}
  #print .rec th:nth-child(3),#print .rec td:nth-child(3),
  #print .rec th:nth-child(4),#print .rec td:nth-child(4),
  #print .rec th:nth-child(5),#print .rec td:nth-child(5){width:14%}
  #print .rec thead{display:table-header-group}
  #print .rec tr{page-break-inside:avoid}
  #print .rec th{text-align:left;border-bottom:1.5px solid #000;padding:5px 6px;
    font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#000}
  #print .rec td{border-bottom:.5px solid #c4c4c4;padding:5px 6px;vertical-align:top}
  #print .rec .n{text-align:right;white-space:nowrap}
  #print .rec .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;white-space:nowrap}
  #print .rec tr.reste td{font-weight:700}
  #print .rec tr.reste td.d{font-weight:400}
  #print .rec .pbloc{page-break-inside:avoid;margin-bottom:15px}
  #print .rec .pbt{font-size:12.5px;font-weight:700;margin:0 0 4px;
    display:flex;justify-content:space-between;align-items:baseline;gap:16px}
  #print .rec .pbt span{font-size:10.5px;font-weight:400;color:#555;text-align:right}
  #print .rec .ptot{margin:12px 0 0;font-size:12px}
  #print .rec .pfoot{margin-top:9px;padding-top:6px;border-top:.5px solid #999;
    font-size:9.5px;color:#555}
}
</style>

        if (e.status >= 400 && e.status < 500) garderSession(null);

/* --------------------------------------------------------------------------
   Calculs — préparation et livraison sont deux choses différentes

   Pointer une quantité au comptoir, c'est préparer : la pièce est là, elle
   attend de partir. Elle n'est livrée qu'au moment où l'on imprime le bon
   remis au client, et c'est seulement alors qu'elle sort du reste à livrer.

   Trois quantités par ligne, et rien d'autre :
     du   ce que le bon demande
     exp  ce qui est préparé   (boutons + et −)
     liv  ce qui est parti     (confirmé à l'impression)
   -------------------------------------------------------------------------- */
var VERT = 7, ORANGE = 14;
function ralL(l) { return Math.max(0, l.du - l.liv); }          // encore dû
function prepaL(l) { return Math.max(0, l.exp - l.liv); }       // prêt, pas parti
function ralD(d) { return d.lignes.reduce(function (s, l) { return s + ralL(l); }, 0); }
function prepaD(d) { return d.lignes.reduce(function (s, l) { return s + prepaL(l); }, 0); }
function livD(d) { return d.lignes.reduce(function (s, l) { return s + l.liv; }, 0); }
function recD(d) { return d.lignes.reduce(function (s, l) { return s + l.rec; }, 0); }
function duD(d) { return d.lignes.reduce(function (s, l) { return s + l.du; }, 0); }
// Un bon sans aucune ligne n'est pas soldé : il reste à compléter.
function solde(d) { return d.lignes.length > 0 && ralD(d) === 0; }
/* Réceptionné : le SDIS a déclaré, depuis son espace, avoir reçu toutes les
   pièces du bon. C'est la dernière étape de la vie d'un bon. */
function recu(d) { return solde(d) && recD(d) >= duD(d); }
/* Les trois zones de la liste. */
function zone(d) { return recu(d) ? 'recu' : (solde(d) ? 'livre' : 'cours'); }
function nivAge(a) { return a < VERT ? 'g' : (a <= ORANGE ? 'o' : 'r'); }

/* L'état d'une ligne. La préparation passe devant : c'est l'action en cours,
   celle qui appelle un geste. */
function etatL(l) {
  if (prepaL(l) > 0) return 'prepa';
  if (ralL(l) === 0) return l.rec >= l.du ? 'recu' : 'livre';
  return l.liv > 0 ? 'partiel' : 'attente';
}
/* L'état d'un bon suit la même règle, puis l'ancienneté sert d'alerte sur ce
   qui dort encore. */
function statut(d) {
  if (prepaD(d) > 0) return 'prepa';
  if (recu(d)) return 'recu';
  if (solde(d)) return 'livre';
  if (livD(d) > 0) return 'partiel';
  var n = nivAge(d.age);
  return n === 'r' ? 'late' : (n === 'o' ? 'warn' : 'attente');
}

/* Teintes des pastilles d'opérateur. Elles tournent autour du bleu de
   l'interface sans jamais l'être tout à fait : on doit distinguer cinq
   collègues d'un coup d'œil, pas les confondre avec un élément actif. */
var TEINTES = [205, 172, 262, 322, 32, 148, 226];
function teinte(o) { var h = 0, i; for (i = 0; i < o.length; i++) h = (h * 31 + o.charCodeAt(i)) | 0;
  return TEINTES[Math.abs(h) % TEINTES.length]; }
function initiales(o) { var p = String(o).split(/\s+/);
  return p.length > 1 ? (p[0][0] + p[1][0]).toUpperCase() : p[0].slice(0, 2).toUpperCase(); }

  return '<span class="av ' + (cls || 'sm') + '" style="background:hsl(' + teinte(o) + ' 58% 44%)">'

}
/* Un horodatage se lit mieux en date qu'en « il y a 2 j » : on sait tout de
   suite si le pointage date d'avant ou d'après un événement connu. */
function quand(t) {
  if (!t) return '';
  var d = new Date(t);
  if (isNaN(d)) return '';
  var p = function (n) { return ('0' + n).slice(-2); };
  return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear()
       + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());

function humain(e) {
  var m = (e && e.message) || String(e);
  // La base (ou le service devant elle) ne répond plus : c'est la panne du
  // 15-16 novembre. Le remède connu est de redémarrer le projet Supabase.
  if ((e && e.status >= 502 && e.status <= 504) || /PGRST00[23]|Gateway Time-?out/i.test(m))
    return 'La base ne r\u00e9pond pas pour le moment. Si \u00e7a dure plus de 5 minutes : '
         + 'Supabase \u2192 Settings \u2192 General \u2192 Restart project.';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m))
    return 'Base injoignable. Vérifie ta connexion internet ; '
         + 'si elle fonctionne, le projet Supabase est peut-être en veille.';
  if (/42501|permission denied|row-level security/i.test(m)) {
    if (!session) { setTimeout(demanderConnexion, 0);
      return 'Ce poste n\'est pas connect\u00e9 : la base refuse l\'acc\u00e8s. '
           + 'Clique sur \u00ab Connecter ce poste \u00bb.'; }
    return 'La base refuse la modification pour ce compte.';
  }
  if (/JWT|apikey|Invalid API key|401|403/i.test(m))
    return 'Clé d\'accès refusée par la base. Vérifie la clé dans la configuration de la page.';
  if (/relation .* does not exist|42P01/i.test(m))
    return 'Les tables sont absentes. Le script schema.sql n\'a pas encore été exécuté dans Supabase.';
  if (/pas_plus_que_du/.test(m))
    return 'Impossible d\'expédier plus que la quantité due.';
  if (/pas_plus_que_livre/.test(m))
    return 'Le SDIS a d\u00e9j\u00e0 r\u00e9ceptionn\u00e9 ces pi\u00e8ces : on ne peut plus les retirer de la livraison.';
  if (/une_reference_par_bon/.test(m))
    return 'Cette référence figure déjà sur ce bon.';
  return m;
}

/* Écriture d'une ligne. Affichage optimiste, retour arrière si la base refuse. */
function ecrire(ligne, champs) {
  var avant = { du: ligne.du, exp: ligne.exp, liv: ligne.liv };
  // On ne peut pas avoir livré plus qu'on n'a préparé : ramener la préparation
  // sous le livré corrige de fait une livraison déclarée à tort.
  if (champs.qte_expediee !== undefined && champs.qte_expediee < ligne.liv) {
    champs.qte_livree = champs.qte_expediee;
  }
  if (champs.qte_expediee !== undefined) ligne.exp = champs.qte_expediee;
  if (champs.qte_livree !== undefined) ligne.liv = champs.qte_livree;
  if (champs.qte_due !== undefined) ligne.du = champs.qte_due;
  ligne.parQui = moi; ligne.quand = new Date().toISOString();
  champs.modifie_par = moi;

  return api('lignes?id=eq.' + encodeURIComponent(ligne.id),
             { method: 'PATCH', body: champs, prefer: 'return=representation' })
    .then(function (r) {
      if (r && r[0] && isFinite(Number(r[0].qte_due)) && isFinite(Number(r[0].qte_expediee))) {
        ligne.du = Number(r[0].qte_due);
        ligne.exp = Number(r[0].qte_expediee);
        ligne.liv = Number(r[0].qte_livree) || 0;
        ligne.duOcr = r[0].qte_due_ocr == null ? null : Number(r[0].qte_due_ocr);
      }
      erreur = null;
    })
    .catch(function (e) {
      ligne.du = avant.du; ligne.exp = avant.exp;   // on remet comme c'était
      ligne.liv = avant.liv;
      erreur = 'Modification non enregistrée. ' + humain(e);
    })
    .then(function () { rendre(); });
}

/* --------------------------------------------------------------------------
   Identification de l'opérateur
   -------------------------------------------------------------------------- */
function majQui() {
  var b = document.getElementById('who');
  if (moi) {
    b.innerHTML = '<span class="av" style="width:27px;height:27px;font-size:10.5px;background:hsl('
      + teinte(moi) + ' 46% 37%)">' + esc(initiales(moi)) + '</span>';
    b.title = "Changer d'opérateur";
  } else {
    b.innerHTML = '<span class="av anon" style="width:27px;height:27px;font-size:11px">?</span>'
      + "<span>S'identifier</span>";
    b.title = "S'identifier";
  }
}
function demander(apres) {
  enAttente = apres || null;
  var ov = document.createElement('div'); ov.className = 'ov'; ov.id = 'ov';
  ov.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">'
    + '<h3 id="shT">Qui modifie&nbsp;?</h3><p>Saisis ton code op&eacute;rateur &agrave; 3 chiffres.</p>'
    + '<input class="code" id="cd" inputmode="numeric" maxlength="3" autocomplete="off" '
    + 'aria-label="Code op&eacute;rateur" placeholder="&bull;&bull;&bull;">'
    + '<p class="err" id="er"></p>'
    + '<div class="row"><button class="btn" id="cancel">Annuler</button></div></div>';
  document.body.appendChild(ov);
  var cd = document.getElementById('cd'); cd.focus();
  cd.addEventListener('input', function () {
    this.value = this.value.replace(/\D/g, '');
    document.getElementById('er').textContent = '';
    if (this.value.length === 3) {
      var n = CODES[this.value];
      if (n) {
        // On met de côté l'action en attente AVANT de fermer : fermer() remet
        // enAttente à null, et l'action demandée était donc perdue — il fallait
        // recliquer après s'être identifié.
        var suite = enAttente;
        moi = n; derniereAction = Date.now(); majQui(); fermer();
        if (suite) suite();
      } else {
        document.getElementById('er').textContent = 'Code inconnu.';
        this.classList.add('bad');
        var i = this;
        setTimeout(function () { i.classList.remove('bad'); i.value = ''; }, 430);
      }
    }
  });
  document.getElementById('cancel').addEventListener('click', fermer);
  ov.addEventListener('click', function (e) { if (e.target === ov) fermer(); });
  document.addEventListener('keydown', echap);
}
function echap(e) { if (e.key === 'Escape') fermer(); }
function fermer() {
  var o = document.getElementById('ov'); if (o) o.remove();
  enAttente = null; document.removeEventListener('keydown', echap);
}
function agir(fn) {
  if (!session) { demanderConnexion(); return; }   // sans connexion, la base refuserait
  if (!moi || Date.now() - derniereAction > CONFIG.verrouMinutes * 60000) { demander(fn); return; }
  derniereAction = Date.now(); fn();
}

/* --------------------------------------------------------------------------
   Animation FLIP
   -------------------------------------------------------------------------- */
function flip(racine, redessine) {
  var red = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var avant = {};
  if (!red) [].forEach.call(racine.querySelectorAll('[data-fk]'), function (el) {
    avant[el.dataset.fk] = el.getBoundingClientRect().top;
  });
  redessine();
  if (red) return;
  [].forEach.call(racine.querySelectorAll('[data-fk]'), function (el) {
    var a = avant[el.dataset.fk]; if (a == null) return;
    var dy = a - el.getBoundingClientRect().top;
    if (Math.abs(dy) < 1) return;
    el.style.transition = 'none';
    el.style.transform = 'translateY(' + dy + 'px)';
    requestAnimationFrame(function () {
      el.style.transition = 'transform .46s cubic-bezier(.22,1,.36,1)';
      el.style.transform = '';
      setTimeout(function () { el.style.transition = ''; }, 500);
    });
  });
}

/* --------------------------------------------------------------------------
   Filtrage
   -------------------------------------------------------------------------- */
function visibles() {
  var t = q.trim().toUpperCase().replace(/\s+/g, '');
  return DATA.filter(function (d) {
    if (pilule === 'ral' && solde(d)) return false;
    if (!pilule) {
      if (filtre === 'ral' && solde(d)) return false;
    }
    if (fop && d.op !== fop && !d.lignes.some(function (l) { return l.op === fop; })) return false;
    if (!t) return true;
    if (String(d.num).indexOf(t) >= 0 || String(d.vref).toUpperCase().indexOf(t) >= 0) return true;
    return d.lignes.some(function (l) {
      return l.ref.toUpperCase().replace(/\s+/g, '').indexOf(t) >= 0
        || l.des.toUpperCase().indexOf(q.trim().toUpperCase()) >= 0;
    });
  });
}

/* --------------------------------------------------------------------------
   Rendu
   -------------------------------------------------------------------------- */
function rendrePilules() {
  var ral = 0;
  DATA.forEach(function (d) {
    d.lignes.forEach(function (l) { if (ralL(l) > 0) ral++; });
  });
  var av = 0;
  DATA.forEach(function (d) { d.lignes.forEach(function (l) { if (l.verif) av++; }); });
  document.querySelector('#pRal b').textContent = ral;
  var pv = document.getElementById('pVerif');
  pv.querySelector('b').textContent = av;
  pv.hidden = av === 0 && vue !== 'verif';
  document.getElementById('nouveau').setAttribute('aria-pressed', vue === 'saisie');
  pv.setAttribute('aria-pressed', vue === 'verif');
  document.getElementById('pRal').setAttribute('aria-pressed', pilule === 'ral');
}

/* La jauge porte deux niveaux : le plein, c'est ce qui est parti ; le liseré
   clair par-dessus, ce qui est prêt mais pas encore livré. On voit d'un coup
   d'œil un bon dont la marchandise attend sur l'étagère. */
function ligneBon(d) {
  var s = statut(d);
  var tot = d.lignes.reduce(function (a, l) { return a + l.du; }, 0);
  var liv = livD(d), pre = prepaD(d);
  var pLiv = tot ? Math.round(100 * liv / tot) : 100;
  var pPre = tot ? Math.round(100 * Math.min(liv + pre, tot) / tot) : 100;
  return '<button class="item s-' + s + '" data-id="' + d.id + '" data-fk="d' + d.id + '" '
    + 'aria-current="' + (d.id === sel) + '">'
    + '<span class="r1"><span class="nat">' + d.nat + '</span>'
    + '<span class="bn">' + esc(d.num) + '</span>'
    + '<span class="vr">' + esc(d.vref) + '</span></span>'
    + '<span class="r2">' + avatar(d.op) + '<span>' + esc(d.date.slice(0, 5)) + '</span>'
    + '<span class="bar"><u style="width:' + pPre + '%"></u>'
      + '<i style="width:' + pLiv + '%"></i></span>'
    + (s === 'recu' ? '<span class="bdg rv">R&eacute;ceptionn&eacute;</span>'
       : s === 'livre' ? '<span class="bdg g">Livr&eacute;</span>'
       : s === 'prepa' ? '<span class="bdg b">En pr&eacute;pa</span>'
       : '<span class="bdg ' + nivAge(d.age) + '">J+' + d.age + '</span>')
    + '</span></button>';
}

/* Trois zones : les bons en cours (nouveaux, en attente, livrés en partie),
   les bons livrés en totalité, et les bons que le SDIS a déclarés reçus.
   La recherche les parcourt toutes les trois et n'affiche que ce qui
   correspond ; une zone repliée s'ouvre d'elle-même si elle a un résultat. */
var ouvZone = { livre: false, recu: false };
var CHEVRON = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" '
  + 'stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';

function rendreListe() {
  var el = document.getElementById('lwrap');
  var zl = document.getElementById('zLivre'), zr = document.getElementById('zRecu');
  if (chargement) {
    el.innerHTML = '<div class="empty">Chargement&hellip;</div>';
    zl.hidden = zr.hidden = true; return;
  }
  var v = visibles(), cherche = !!q.trim(), h = '';
  var par = { cours: [], livre: [], recu: [] };
  v.forEach(function (d) { par[zone(d)].push(d); });
  if (par.cours.length) {
    h += '<div class="grp">En cours &middot; ' + par.cours.length + '</div>';
    par.cours.forEach(function (d) { h += ligneBon(d); });

/* Qui a réceptionné, et quand : au survol de la quantité reçue. */
function titreRec(l) {
  if (!l.rec) return '';
  var t = l.recPar === 'reprise' ? 'D\u00e9j\u00e0 livr\u00e9 avant la mise en service de la r\u00e9ception'
        : 'R\u00e9ceptionn\u00e9 par ' + (l.recPar || '?') + (l.recLe ? ' le ' + quand(l.recLe) : '');
  return ' title="' + esc(t) + '"';
}

/* Suppression d'un bon entier, lignes et historique compris. */
function supprimerBon(d) {
  if (!window.confirm('Supprimer le ' + d.nat + ' n\u00b0 ' + d.bon + ' (V/r\u00e9f. ' + d.vref + ') ?\n\n'
      + 'Le bon, ses ' + d.lignes.length + ' ligne' + (d.lignes.length > 1 ? 's' : '')
      + ' et son historique disparaîtront définitivement.')) return;
  var pos = DATA.indexOf(d);
  DATA.splice(pos, 1);
  sel = DATA.length ? DATA[Math.min(pos, DATA.length - 1)].id : null;
  vueBon = 'lignes'; ajout = null;
  rendre();
  api('bons?id=eq.' + encodeURIComponent(d.id), { method: 'DELETE', prefer: 'return=minimal' })
    .then(function () { erreur = null; })
    .catch(function (e) {
      DATA.splice(pos, 0, d); sel = d.id;
      erreur = 'Suppression non enregistr\u00e9e. ' + humain(e);
    })
    .then(rendre);
}

/* --------------------------------------------------------------------------
   Correction de la V/référence et du n° de commande

   Le n° de bon, le client, le dépôt et la date viennent du code-barres : ils
   sont sûrs. Ces deux champs-là sont lus à l'œil sur la page, sans filet —
   et la V/référence est précisément le numéro que le SDIS utilise pour nous
   relancer. Il fallait pouvoir la corriger sans passer par la base.
   -------------------------------------------------------------------------- */
var ENTETE = {
  vref: {
    col: 'vreference', lib: 'V/r&eacute;f&eacute;rence SDIS', ph: 'T3262755',
    /* Format maison : T suivi de 7 chiffres. On normalise ce qui y ressemble
       et on laisse passer le reste tel quel — l'opérateur a le papier. */
    nettoie: function (v) {
      v = v.replace(/\s+/g, '').toUpperCase();
      return /^T?\d+$/.test(v) ? 'T' + v.replace(/\D/g, '') : v;
    }
  },
  cmde: {
    col: 'num_commande', lib: 'N&deg; commande', ph: '0046259',
    nettoie: function (v) {
      v = v.replace(/\s+/g, '');
      if (!/^\d+$/.test(v)) return v;
      while (v.length < 7) v = '0' + v;
      return v;
    }
  }
};

function champEntete(d, quoi) {
  var c = ENTETE[quoi], lu = quoi === 'vref' ? d.vrefOcr : d.cmdeOcr;
  return '<button class="ed' + (lu ? ' corr' : '') + '" data-ent="' + quoi + '" title="'
    + (lu ? 'Corrig&eacute; &agrave; la main (le scan indiquait ' + esc(lu) + ')'
          : 'Cliquer pour corriger')
    + '">' + esc(d[quoi]) + '</button>';
}

function editerEntete(d, quoi, cible) {
  var c = ENTETE[quoi];
  if (!c || document.querySelector('.entin')) return;
  var avant = d[quoi] === '—' ? '' : d[quoi];
  var inp = document.createElement('input');
  inp.type = 'text'; inp.className = 'entin' + (quoi === 'vref' ? ' maj' : ''); inp.value = avant;
  inp.setAttribute('placeholder', c.ph);
  inp.setAttribute('aria-label', c.lib.replace(/&[a-z]+;/g, ''));
  cible.replaceWith(inp); inp.focus(); inp.select();

  var fini = false;
  function valider(ok) {
    if (fini) return; fini = true;
    var v = c.nettoie(inp.value);
    if (!ok || v === avant) { rendre(); return; }
    var champs = {}; champs[c.col] = v || null;
    champs.corrige_par = moi;
    d[quoi] = v || '—';
    rendre();
    api('bons?id=eq.' + encodeURIComponent(d.id),
        { method: 'PATCH', body: champs, prefer: 'return=representation' })
      .then(function (r) {
        if (r && r[0]) {
          d.vrefOcr = r[0].vreference_ocr || '';
          d.cmdeOcr = r[0].commande_ocr || '';
        }
        erreur = null;
      })
      .catch(function (e) {
        d[quoi] = avant || '—';
        erreur = 'Correction non enregistr&eacute;e. ' + humain(e);
      })
      .then(rendre);
  }
  inp.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') valider(true);
    if (ev.key === 'Escape') valider(false);
  });
  inp.addEventListener('blur', function () { valider(true); });
}

/* --------------------------------------------------------------------------
   Historique des livraisons d'un bon

   Seuls les mouvements de quantité expédiée y figurent : c'est le fil de la
   livraison, pas le journal technique. Les corrections de référence ou de
   quantité due sont tracées en base, mais elles ne racontent pas au client ni
   au comptoir ce qui est parti et quand.

   Chargé à la demande, une fois par bon : l'historique n'intéresse que celui
   qui l'ouvre, inutile de le tirer pour tous les bons à chaque rafraîchissement.
   -------------------------------------------------------------------------- */
function chargerHisto(d) {
  HISTO[d.id] = { etat: 'charge' };
  api('v_mouvements?select=*&bon_id=eq.' + encodeURIComponent(d.id)
      + '&champ=eq.qte_livree&order=au.desc')
    .then(function (r) {
      HISTO[d.id] = { etat: 'ok', lignes: r || [] };
    })
    .catch(function (e) {
      HISTO[d.id] = { etat: 'erreur', msg: humain(e) };
    })
    .then(function () { if (vueBon === 'histo' && sel === d.id) rendreDetail(); });
}

function corpsHisto(d) {
  var h = HISTO[d.id];
  if (!h) { chargerHisto(d); return '<div class="empty">Chargement de l\'historique&hellip;</div>'; }
  if (h.etat === 'charge') return '<div class="empty">Chargement de l\'historique&hellip;</div>';
  if (h.etat === 'erreur') {
    return '<div class="empty">Historique indisponible.<br>' + esc(h.msg) + '</div>';
  }
  if (!h.lignes.length) {
    return '<div class="empty">Aucune livraison enregistr&eacute;e sur ce bon.<br>'
      + 'Chaque pointage de quantit&eacute; exp&eacute;di&eacute;e viendra s\'inscrire ici.</div>';
  }

  /* Les mouvements d'une même journée sont regroupés : c'est ainsi qu'on s'en
     souvient — « la livraison de mardi », pas « le mouvement de 14 h 32 ». */
  var jours = [], parJour = {};
  h.lignes.forEach(function (m) {
    var j = jourDe(m.au);
    if (!parJour[j]) { parJour[j] = []; jours.push(j); }
    parJour[j].push(m);
  });

  var out = '<div class="histo">';
  jours.forEach(function (j) {
    var lot = parJour[j], total = 0;
    lot.forEach(function (m) { total += Math.max(0, Number(m.apres) - Number(m.avant)); });
    out += '<div class="hj"><span class="hjd">' + esc(j) + '</span>'
      + '<span class="hjn">' + lot.length + ' mouvement' + (lot.length > 1 ? 's' : '')
      + (total > 0 ? ' &middot; ' + total + ' pi&egrave;ce' + (total > 1 ? 's' : '') : '')
      + '</span></div>';
    lot.forEach(function (m) {
      var av = Number(m.avant) || 0, ap = Number(m.apres) || 0, delta = ap - av;
      out += '<div class="hm">'
        + '<span class="hh">' + esc(heureDe(m.au)) + '</span>'
        + '<span class="hr">' + refHtml(m.reference) + '</span>'
        + '<span class="hd">' + esc(m.designation || '') + '</span>'
        + '<span class="hq">' + av + '<i>&rarr;</i>' + ap + '</span>'
        + '<span class="hv ' + (delta >= 0 ? 'p' : 'n') + '">'
          + (delta >= 0 ? '+' : '&minus;') + Math.abs(delta) + '</span>'
        + '<span class="ho" title="' + esc(m.operateur || '') + '">'
          + avatar(m.operateur || '—') + '</span>'
        + '</div>';
    });
  });
  return out + '</div>';
}

function jourDe(t) {
  var d = new Date(t);
  if (isNaN(d)) return '';
  var p = function (n) { return ('0' + n).slice(-2); };
  return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear();
}
function heureDe(t) {
  var d = new Date(t);
  if (isNaN(d)) return '';
  var p = function (n) { return ('0' + n).slice(-2); };
  return p(d.getHours()) + ':' + p(d.getMinutes());
}

function rendreErreur() {
  var b = document.getElementById('bandeau');
  if (erreur) { b.textContent = erreur; b.hidden = false; }
  else b.hidden = true;
}

function rendreCentre() {
  if (vue === 'saisie') rendreSaisie();
  else if (vue === 'verif') rendreVerif();
  else rendreDetail();
}
function rendre() { rendrePilules(); rendreListe(); rendreCentre(); rendreErreur(); }


/* --------------------------------------------------------------------------
   Feuilles imprimables remises au client

   Le chauffeur repart avec une feuille par bon : le client voit d'un coup
   d'œil ce qu'il a reçu et ce qu'on lui doit encore, sans avoir à recouper
   ses propres bons. Le récapitulatif, lui, se sort à la demande — c'est la
   même information, vue de l'autre bout : tout ce qui reste dû, tous bons
   confondus.

   Rien n'est envoyé nulle part : on remplit un bloc caché de la page et on
   laisse le navigateur imprimer. Pas de fenêtre surgissante à débloquer sur
   les postes du comptoir.
   -------------------------------------------------------------------------- */
function maintenant() {
  var d = new Date(), p = function (n) { return ('0' + n).slice(-2); };
  return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear()
       + ' &agrave; ' + p(d.getHours()) + 'h' + p(d.getMinutes());
}

function pPied() {

}

/* --- code-barres Code39, comme sur les bons SOUBAUTO ---------------------- */
var C39 = { '0':'nnnwwnwnn', '1':'wnnwnnnnw', '2':'nnwwnnnnw', '3':'wnwwnnnnn',
            '4':'nnnwwnnnw', '5':'wnnwwnnnn', '6':'nnwwwnnnn', '7':'nnnwnnwnw',
            '8':'wnnwnnwnn', '9':'nnwwnnwnn', '*':'nwnnwnwnn' };

function codeBarres(txt) {
  var s = '*' + String(txt).replace(/\D/g, '') + '*', mods = [], i, j;
  mods.push([false, 10]);                  // marge blanche exigée par les lecteurs
  for (i = 0; i < s.length; i++) {
    var m = C39[s.charAt(i)];
    if (!m) continue;
    for (j = 0; j < 9; j++) mods.push([j % 2 === 0, m.charAt(j) === 'w' ? 3 : 1]);
    mods.push([false, 1]);                 // séparateur inter-caractère
  }
  mods[mods.length - 1] = [false, 10];
  var total = 0;
  mods.forEach(function (m) { total += m[1]; });
  var x = 0, r = '';
  mods.forEach(function (m) {
    if (m[0]) r += '<rect x="' + x.toFixed(2) + '" y="0" width="' + m[1]
                 + '" height="10" fill="#000"/>';
    x += m[1];
  });
  return '<svg class="cb" viewBox="0 0 ' + total + ' 10" preserveAspectRatio="none">'
       + r + '</svg>';
}

/* Le code composite des bons SOUBAUTO : n° de bon + dépôt + date AAMMJJ. */
function codeCompose(d) {
  var p = String(d.date || '').split('/');
  var jour = p.length === 3 ? p[2].slice(2) + p[1] + p[0] : '';
  return String(d.num || '').replace(/\D/g, '') + '33' + jour;
}

/* Une ligne du bon imprimé. La quantité affichée dépend de la section où
   elle figure — c'est le titre de la section qui lui donne son sens, et la

function blLigne(l, qte) {

function blZone(titre, suite) {

/* Une respiration entre deux sections. Collées, les trois barres grises se

function blEspace() {

/* Le cadre à faire tamponner. Il ne figure que sur la DERNIÈRE page : c'est
   la feuille que le livreur présente, et un tampon par page n'a pas de sens.

function blTampon() {

/* Date ET heure du bandeau sont celles de l'impression, pas celles du bon :
   les trois cases Date, Heure et Opérateur décrivent le même événement —

   par son numéro et par le code-barres.

   Calculées une seule fois pour tout le document, sinon la minute pourrait
   changer entre la page 1 et la page 2. */
function instantImpression() {
  var d = new Date(), p = function (n) { return ('0' + n).slice(-2); };
  return {
    date: p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear(),
    heure: p(d.getHours()) + ':' + p(d.getMinutes())
  };
}
