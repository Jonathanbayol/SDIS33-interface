# Publie le dossier site/ sur GitHub Pages à chaque modification fusionnée
# dans main. Adresses :
#   https://jonathanbayol.github.io/SDIS33-interface/comptoir/
#   https://jonathanbayol.github.io/SDIS33-interface/client/
# Prérequis (une seule fois) : Settings → Pages → Source : « GitHub Actions ».
name: Publier le site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v4
